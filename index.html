}

function downloadText(name, content, type = 'text/plain;charset=utf-8') {
  downloadBlob(name, new Blob([content], { type }))
}

// ==================== Path Resolution ====================
const pathDir = (p) => p.split('/').slice(0, -1).join('/')

function resolvePath(base, rel) {
  if (!rel || /^(data:|https?:|blob:)/i.test(rel)) return rel
  if (rel.startsWith('#')) return `${base.split('#')[0]}${rel}`
  
  const cleanBase = base.split(/[?#]/)[0]
  const match = rel.trim().match(/^([^?#]*)([?#].*)?$/)
  const cleanRel = (match?.[1] || '').replace(/\\/g, '/')
  const suffix = match?.[2] || ''
  const parts = (cleanRel.startsWith('/') ? cleanRel.slice(1) : `${pathDir(cleanBase)}/${cleanRel}`).split('/')
  const out = []
  
  for (const p of parts) {
    if (p === '..') out.pop()
    else if (p !== '.' && p) out.push(p)
  }
  
  return out.join('/') + suffix
}

const mime = (name) => ({
  css: 'text/css',
  html: 'text/html',
  htm: 'text/html',
  xhtml: 'application/xhtml+xml',
  xml: 'application/xml',
  svg: 'image/svg+xml',
  png: 'image/png',
  jpg: 'image/jpeg',
  jpeg: 'image/jpeg',
  gif: 'image/gif',
  webp: 'image/webp',
  avif: 'image/avif',
  bmp: 'image/bmp',
  woff: 'font/woff',
  woff2: 'font/woff2',
  ttf: 'font/ttf',
  ttc: 'font/collection',
  otf: 'font/otf',
  eot: 'application/vnd.ms-fontobject',
  mp3: 'audio/mpeg',
  mp4: 'video/mp4'
}[name.split(/[?#]/)[0].split('.').pop().toLowerCase()] || 'application/octet-stream')

// ==================== ZIP Reader ====================
class ZipReader {
  constructor(buffer) {
    this.data = new Uint8Array(buffer)
    this.files = new Map()
    this.ready = this.index()
  }

  u16(i) {
    return this.data[i] | this.data[i + 1] << 8
  }

  u32(i) {
    return (this.u16(i) | this.u16(i + 2) << 16) >>> 0
  }

  async index() {
    if (this.data.length < 22) throw new Error('不是有效的 EPUB/ZIP 文件')
    let end = this.data.length - 22
    while (end >= Math.max(0, this.data.length - 65557) && this.u32(end) !== 0x06054b50) end--
    if (end < 0) throw new Error('不是有效的 EPUB/ZIP 文件')
    const directorySize = this.u32(end + 12)
    const total = this.u16(end + 10)
    const offset = this.u32(end + 16)
    if (total > 100000 || offset > this.data.length || directorySize > this.data.length - offset || offset + directorySize > end) {
      throw new Error('EPUB ZIP 目录无效')
    }
    let p = offset
    
    for (let i = 0; i < total; i++) {
      if (p < offset || p + 46 > offset + directorySize || p + 46 > this.data.length || this.u32(p) !== 0x02014b50) throw new Error('EPUB 目录损坏')
      
      const method = this.u16(p + 10)
      const size = this.u32(p + 20)
      const rawSize = this.u32(p + 24)
      const nl = this.u16(p + 28)
      const el = this.u16(p + 30)
      const cl = this.u16(p + 32)
      const local = this.u32(p + 42)
      if (p + 46 + nl + el + cl > this.data.length || local + 30 > this.data.length) {
        throw new Error('EPUB ZIP 条目越界')
      }
      const name = dec.decode(this.data.slice(p + 46, p + 46 + nl + 0)).replace(/^\.\//, '')
      if (size > 512 * 1024 * 1024 || rawSize > 512 * 1024 * 1024 || rawSize > size * 200 + 1024 * 1024) {
        throw new Error('EPUB 资源大小或压缩比无效')
      }
      
      this.files.set(name, { method, size, rawSize, local })
      p += 46 + nl + el + cl
    }
  }

  async bytes(name) {
    await this.ready
    const raw = name.split(/[?#]/)[0].replace(/^\.\//, '').replace(/\\/g, '/')
    let decoded = raw
    
    try {
      decoded = decodeURIComponent(raw)
    } catch {}
    
    let f = this.files.get(decoded) || this.files.get(raw)
    
    if (!f) {
      const lower = decoded.toLowerCase()
      const match = [...this.files.keys()].find(k => k.toLowerCase() === lower)
      if (match) f = this.files.get(match)
    }
    
    if (!f) return null
    
    const nl = this.u16(f.local + 26)
    const el = this.u16(f.local + 28)
    if (this.u32(f.local) !== 0x04034b50 || f.local + 30 + nl + el + f.size > this.data.length || f.rawSize > 512 * 1024 * 1024) {
      throw new Error('EPUB 资源大小或偏移无效')
    }
    const body = this.data.slice(f.local + 30 + nl + el, f.local + 30 + nl + el + f.size)
    
    if (f.method === 0) return body
    
    if (f.method !== 8 || !globalThis.DecompressionStream) {
      throw new Error('浏览器不支持此 EPUB 的压缩格式')
    }
    
    const stream = new Blob([body]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
    const output = new Uint8Array(await new Response(stream).arrayBuffer())
    if (output.byteLength !== f.rawSize) throw new Error('EPUB 资源解压大小不匹配')
    return output
  }

  async text(name) {
    const b = await this.bytes(name)
    return b && dec.decode(b)
  }
}
// ==================== EPUB Parser ====================
async function parseEpub(buffer) {
  const zip = new ZipReader(buffer)
  const container = await zip.text('META-INF/container.xml')
  if (!container) throw new Error('缺少 EPUB container.xml')
  
  const cx = new DOMParser().parseFromString(container, 'application/xml')
  if (cx.querySelector('parsererror')) throw new Error('EPUB container.xml 格式无效')
  const opfPath = cx.querySelector('rootfile')?.getAttribute('full-path')
  if (!opfPath || /^(?:[a-z]+:|\/)/i.test(opfPath)) throw new Error('EPUB 内容清单路径无效')
  const opfText = await zip.text(opfPath)
  if (!opfText) throw new Error('无法读取 EPUB 内容清单')
  
  const opf = new DOMParser().parseFromString(opfText, 'application/xml')
  if (opf.querySelector('parsererror')) throw new Error('EPUB 内容清单格式无效')
  const title = opf.querySelector('metadata title, dc\\:title, title')?.textContent?.trim() || '未命名书籍'
  const author = opf.querySelector('metadata creator, dc\\:creator, creator')?.textContent?.trim() || '未知作者'
  const direction = opf.querySelector('spine')?.getAttribute('page-progression-direction') || 'ltr'
  const renditionLayout = opf.querySelector('meta[property="rendition:layout"]')?.textContent?.trim() || 'reflowable'
  
  const uniqueIdRef = opf.documentElement.getAttribute('unique-identifier')
  const identifiers = [...opf.querySelectorAll('identifier,dc\\:identifier')]
  const uniqueIdentifier = (identifiers.find(x => x.getAttribute('id') === uniqueIdRef) || identifiers[0])?.textContent?.replace(/\s+/g, '').trim() || ''
  
  const encryption = new Map()
  const encryptionText = await zip.text('META-INF/encryption.xml')
  if (encryptionText) {
    const encryptionDoc = new DOMParser().parseFromString(encryptionText, 'application/xml')
    for (const item of encryptionDoc.querySelectorAll('EncryptedData')) {
      const algorithm = item.querySelector('EncryptionMethod')?.getAttribute('Algorithm') || ''
      const uri = item.querySelector('CipherReference')?.getAttribute('URI')?.replace(/^\.\//, '')
      if (uri) {
        encryption.set(uri, { algorithm })
        encryption.set(resolvePath('META-INF/encryption.xml', uri), { algorithm })
      }
    }
  }
  
  const manifest = new Map()
  opf.querySelectorAll('manifest item').forEach((n) => {
    manifest.set(n.getAttribute('id'), {
      href: n.getAttribute('href'),
      type: n.getAttribute('media-type'),
      properties: n.getAttribute('properties') || ''
    })
  })
  
  const spine = [...opf.querySelectorAll('spine itemref')]
    .map((n) => manifest.get(n.getAttribute('idref')))
    .filter(Boolean)
    .map((x) => resolvePath(opfPath, x.href))

  if (!spine.length) throw new Error('EPUB 没有可阅读的正文')

  let toc = []
  const navItem = [...manifest.values()].find((x) => x.properties.includes('nav'))
  
  if (navItem) {
    const navPath = resolvePath(opfPath, navItem.href)
    const navText = await zip.text(navPath)
    const navDoc = new DOMParser().parseFromString(navText, 'application/xhtml+xml')
    const navs = [...navDoc.querySelectorAll('nav')]
    const tocNav = navs.find(n => 
      (n.getAttribute('epub:type') || n.getAttributeNS('http://www.idpf.org/2007/ops', 'type') || '')
        .split(/\s+/)
        .includes('toc')
    ) || navs[0]
    
    toc = [...(tocNav?.querySelectorAll('a') || [])]
      .map((a) => ({
        label: a.textContent.trim(),
        href: resolvePath(navPath, a.getAttribute('href'))
      }))
      .filter(x => x.label && x.href)
  } else {
    const tocId = opf.querySelector('spine')?.getAttribute('toc')
    const ncxItem = manifest.get(tocId) || [...manifest.values()].find((x) => x.type === 'application/x-dtbncx+xml')
    
    if (ncxItem) {
      const ncxPath = resolvePath(opfPath, ncxItem.href)
      const ncx = new DOMParser().parseFromString(await zip.text(ncxPath), 'application/xml')
      toc = [...ncx.querySelectorAll('navPoint')].map((n) => ({
        label: n.querySelector('navLabel text')?.textContent.trim() || '章节',
        href: resolvePath(ncxPath, n.querySelector('content')?.getAttribute('src'))
      }))
    }
  }
  
  if (!toc.length) {
    toc = spine.map((href, i) => ({ label: `第 ${i + 1} 章`, href }))
  }
  
  const coverMeta = opf.querySelector('meta[name="cover"]')?.getAttribute('content')
  const coverItem = manifest.get(coverMeta) || [...manifest.values()].find((x) => x.properties.includes('cover-image'))
  const coverPath = coverItem && resolvePath(opfPath, coverItem.href)
  
  return {
    zip,
    opfPath,
    title,
    author,
    spine,
    toc,
    coverPath,
    direction,
    fixedLayout: renditionLayout === 'pre-paginated',
    uniqueIdentifier,
    encryption
  }
}

function sanitizeEpubDocument(doc) {
  doc.querySelectorAll('script, iframe, form, object, embed, portal').forEach(el => el.remove())
  doc.querySelectorAll('*').forEach(el => {
    for (const attr of [...el.attributes]) {
      if (/^on/i.test(attr.name) || attr.name === 'srcdoc') el.removeAttribute(attr.name)
    }
  })
  doc.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href') || ''
    if (/^(https?:|javascript:|data:|mailto:)/i.test(href)) {
      a.removeAttribute('href')
      a.removeAttribute('data-epub-href')
    }
  })
  const meta = doc.createElement('meta')
  meta.httpEquiv = 'Content-Security-Policy'
  meta.content = "default-src 'none'; img-src blob: data:; style-src 'unsafe-inline'; font-src blob: data:; media-src blob: data:"
  doc.head?.prepend(meta)
  return doc
}


function clearUrls() {
  state.urls.forEach(URL.revokeObjectURL)
  state.urls = []
  state.assetCache.clear()
}

async function assetUrl(path) {
  if (!path || /^(data:|blob:)/i.test(path)) return path
  if (state.assetCache.has(path)) return state.assetCache.get(path)
  
  state.assetCache.set(path, null)
  const bytes = await state.epub.zip.bytes(path)
  if (!bytes) return null
  
  let data = bytes
  let type = mime(path)
  const encrypted = state.epub.encryption?.get(path)
  
  if (encrypted && /font|opentype|truetype|woff/i.test(type)) {
    data = await deobfuscateFont(bytes, encrypted.algorithm, state.epub.uniqueIdentifier)
  }
  
  if (type === 'image/svg+xml') {
    const svg = new DOMParser().parseFromString(dec.decode(bytes), 'image/svg+xml')
    if (!svg.querySelector('parsererror')) {
      for (const el of [...svg.querySelectorAll('[href]')]) {
        await rewriteResourceAttribute(el, 'href', path)
      }
      
      for (const el of [...svg.querySelectorAll('image,use')]) {
        if (el.hasAttributeNS('http://www.w3.org/1999/xlink', 'href')) {
          const value = el.getAttributeNS('http://www.w3.org/1999/xlink', 'href')
          if (value && !value.startsWith('#')) {
            const [file, frag] = value.split('#')
            const nested = await assetUrl(resolvePath(path, file))
            if (nested) {
              el.setAttributeNS('http://www.w3.org/1999/xlink', 'href', nested + (frag ? `#${frag}` : ''))
            } else {
              el.remove()
            }
          }
        }
      }
      
      for (const el of [...svg.querySelectorAll('[style]')]) {
        el.setAttribute('style', await rewriteCss(el.getAttribute('style'), path))
      }
      
      for (const style of [...svg.querySelectorAll('style')]) {
        style.textContent = await rewriteCss(style.textContent, path)
      }
      
      data = new TextEncoder().encode(new XMLSerializer().serializeToString(svg))
    }
  }
  
  const url = URL.createObjectURL(new Blob([data], { type }))
  state.urls.push(url)
  state.assetCache.set(path, url)
  return url
}

async function deobfuscateFont(bytes, algorithm, id) {
  try {
    let digest, limit
    
    if (/idpf/i.test(algorithm)) {
      digest = new Uint8Array(await crypto.subtle.digest('SHA-1', enc.encode(id)))
      limit = 1040
    } else if (/adobe/i.test(algorithm)) {
      const hex = id.replace(/^urn:uuid:/i, '').replace(/-/g, '')
      digest = Uint8Array.from(hex.match(/../g) || [], x => parseInt(x, 16))
      limit = 1024
    } else {
      return bytes
    }
    
    const out = bytes.slice()
    for (let i = 0; i < Math.min(limit, out.length); i++) {
      out[i] ^= digest[i % digest.length]
    }
    return out
  } catch {
    return bytes
  }
}

function removeBrokenMedia(el, attr) {
  el.removeAttribute(attr)
  if (el.matches('img,image,source,object,embed')) el.remove()
}

async function rewriteResourceAttribute(el, attr, base) {
  const value = el.getAttribute(attr)
  if (!value) return
  if (value.startsWith('#')) return
  if (/^(data:|blob:)/i.test(value)) return
  
  if (/^(https?:|\/\/)/i.test(value)) {
    removeBrokenMedia(el, attr)
    return
  }
  
  const hash = value.indexOf('#')
  const file = hash >= 0 ? value.slice(0, hash) : value
  const fragment = hash >= 0 ? value.slice(hash) : ''
  const url = await assetUrl(resolvePath(base, file))
  
  if (url) {
    el.setAttribute(attr, url + fragment)
  } else {
    removeBrokenMedia(el, attr)
  }
}

async function rewriteSrcset(el, base) {
  const value = el.getAttribute('srcset')
  if (!value) return
  
  const converted = []
  for (const item of value.split(',')) {
    const match = item.trim().match(/^(\S+)(\s+.+)?$/)
    if (!match) continue
    const url = await assetUrl(resolvePath(base, match[1]))
    if (url) converted.push(`${url}${match[2] || ''}`)
  }
  
  if (converted.length) {
    el.setAttribute('srcset', converted.join(', '))
  } else {
    el.removeAttribute('srcset')
  }
}

async function rewriteDocumentResources(doc, path) {
  for (const el of [...doc.querySelectorAll('[src]')]) {
    await rewriteResourceAttribute(el, 'src', path)
  }
  
  for (const el of [...doc.querySelectorAll('[poster]')]) {
    await rewriteResourceAttribute(el, 'poster', path)
  }
  
  for (const el of [...doc.querySelectorAll('[srcset]')]) {
    await rewriteSrcset(el, path)
  }
  
  for (const el of [...doc.querySelectorAll('svg image[href],svg use[href]')]) {
    await rewriteResourceAttribute(el, 'href', path)
  }
  
  for (const el of [...doc.querySelectorAll('svg image,svg use')]) {
    if (el.hasAttributeNS('http://www.w3.org/1999/xlink', 'href')) {
      const value = el.getAttributeNS('http://www.w3.org/1999/xlink', 'href')
      if (!value || value.startsWith('#')) continue
      
      const [file, frag] = value.split('#')
      const url = /^(data:|blob:)/i.test(value) ? value : await assetUrl(resolvePath(path, file))
      
      if (url) {
        el.setAttributeNS('http://www.w3.org/1999/xlink', 'href', url + (frag ? `#${frag}` : ''))
      } else {
        el.remove()
      }
    }
  }
  
  for (const el of [...doc.querySelectorAll('object[data]')]) {
    await rewriteResourceAttribute(el, 'data', path)
  }
  
  for (const el of [...doc.querySelectorAll('link[rel="stylesheet"]')]) {
    const cssPath = resolvePath(path, el.getAttribute('href'))
    const css = await state.epub.zip.text(cssPath)
    
    if (css) {
      const style = doc.createElement('style')
      style.textContent = await rewriteCss(css, cssPath)
      el.replaceWith(style)
    } else {
      el.remove()
    }
  }
  
  for (const style of [...doc.querySelectorAll('style')]) {
    style.textContent = await rewriteCss(style.textContent, path)
  }
  
  for (const el of [...doc.querySelectorAll('[style]')]) {
    el.setAttribute('style', await rewriteCss(el.getAttribute('style'), path))
  }
}

async function rewriteCss(css, base, seen = new Set()) {
  const key = base.split('#')[0]
  if (seen.has(key) || seen.size > 32) return ''
  const chain = new Set(seen)
  chain.add(key)
  const imports = [...css.matchAll(/@import\s+(?:url\()?['"]?([^'"\s\)]+)['"]?\)?\s*;/gi)]
  
  for (const m of imports) {
    const importPath = resolvePath(base, m[1])
    const nested = await state.epub.zip.text(importPath)
    css = css.replace(m[0], nested ? await rewriteCss(nested, importPath, chain) : '')
  }
  
  const matches = [...css.matchAll(/url\((['"]?)(.*?)\1\)/g)]
  
  for (const m of matches) {
    const value = m[2].trim()
    if (!value || value.startsWith('#')) continue
    
    if (/^(https?:|\/\/)/i.test(value)) {
      css = css.replace(m[0], 'url("")')
      continue
    }
    
    if (/^(data:|blob:)/i.test(value)) continue
    
    const [file, frag] = value.split('#')
    const url = await assetUrl(resolvePath(base, file))
    css = css.replace(m[0], url ? `url("${url}${frag ? `#${frag}` : ''}")` : 'url("")')
  }
  
  return css
}
// ==================== Book Import ====================
async function importFiles(files) {
  try {
    await navigator.storage?.persist?.()
  } catch {}
  
  let imported = 0
  let skipped = 0
  const failed = []
  
  for (const file of files) {
    if (!file.name.toLowerCase().endsWith('.epub')) continue
    
    toast(`正在导入《${file.name}》…`)
    
    try {
      const buffer = await file.arrayBuffer()
      const hash = await fileHash(buffer)
      const existing = (await getBooks()).find(b => 
        b.hash === hash || 
        (!b.hash && b.name === file.name && (b.size || b.data?.byteLength) === buffer.byteLength)
      )
      
      if (existing) {
        skipped++
        continue
      }
      
      const epub = await parseEpub(buffer)
      let cover = null
      
      if (epub.coverPath) {
        const bytes = await epub.zip.bytes(epub.coverPath)
        if (bytes) {
          cover = await blobToData(new Blob([bytes], { type: mime(epub.coverPath) }))
        }
      }
      
      const book = {
        id: uid(),
        hash,
        name: file.name,
        title: epub.title,
        author: epub.author,
        cover,
        data: buffer,
        size: buffer.byteLength,
        chapter: 0,
        progress: 0,
        notes: [],
        settings: {},
        locator: { chapter: 0, offset: 0, ratio: 0 },
        added: Date.now(),
        lastRead: 0
      }
      
      await saveBook(book)
      imported++
      broadcastLibraryChange(book.id)
    } catch (e) {
      const isQuota = /quota/i.test(e?.name || e?.message || '')
      failed.push(`${file.name}：${isQuota ? '本地存储空间不足' : e.message}`)
    }
  }
  
  await loadLibrary()
  
  const parts = []
  if (imported) parts.push(`已导入 ${imported} 本`)
  if (skipped) parts.push(`跳过 ${skipped} 本重复图书`)
  if (failed.length) parts.push(`${failed.length} 本失败：${failed[0]}`)
  
  toast(parts.join(' · ') || '没有找到可导入的 EPUB', failed.length ? 5200 : 2800)
}

// ==================== Library Management ====================
async function loadLibrary() {
  state.books = (await getBooks()).map(normalizeBook).filter(Boolean)
  $('#libraryCount').textContent = `${state.books.length} 本书`
  
  renderLibrary()
  scheduleLegacyHashUpgrade()
}

function scheduleLegacyHashUpgrade() {
  const pending = state.books.filter(b => !b.hash && b.data instanceof ArrayBuffer)
  if (!pending.length) return
  
  const run = async () => {
    for (const book of pending) {
      try {
        book.hash = await fileHash(book.data)
        book.size ||= book.data.byteLength
        await saveBook(book)
      } catch {}
    }
  }
  
  if ('requestIdleCallback' in window) {
    requestIdleCallback(() => run(), { timeout: 4000 })
  } else {
    setTimeout(run, 800)
  }
}

function coverFlowOffset(cardIndex, activeIndex, total) {
  const raw = cardIndex - activeIndex
  if (total <= 3) return raw
  return ((raw + total / 2) % total + total) % total - total / 2
}

function fallbackCoverPalette(book) {
  let hash = 0
  for (const char of `${book?.title || ''}${book?.author || ''}`) hash = (hash * 31 + char.charCodeAt(0)) >>> 0
  const hue = hash % 360
  const hsl = (h, s, l) => {
    s /= 100; l /= 100
    const c = (1 - Math.abs(2 * l - 1)) * s
    const x = c * (1 - Math.abs((h / 60) % 2 - 1))
    const m = l - c / 2
    const [r, g, b] = h < 60 ? [c,x,0] : h < 120 ? [x,c,0] : h < 180 ? [0,c,x] : h < 240 ? [0,x,c] : h < 300 ? [x,0,c] : [c,0,x]
    return [r,g,b].map(v => Math.round((v + m) * 255))
  }
  return [hsl(hue, 34, 38), hsl((hue + 48) % 360, 30, 28)]
}

async function coverPalette(book) {
  state.coverPaletteCache ||= new Map()
  if (state.coverPaletteCache.has(book.id)) return state.coverPaletteCache.get(book.id)
  const fallback = fallbackCoverPalette(book)
  if (!book.cover) {
    state.coverPaletteCache.set(book.id, fallback)
    return fallback
  }
  try {
    const image = new Image()
    image.src = book.cover
    await image.decode()
    const canvas = document.createElement('canvas')
    canvas.width = 28
    canvas.height = 42
    const context = canvas.getContext('2d', { willReadFrequently:true })
    context.drawImage(image, 0, 0, canvas.width, canvas.height)
    const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data
    const buckets = new Map()
    for (let i = 0; i < pixels.length; i += 16) {
      const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2], a = pixels[i + 3]
      if (a < 180) continue
      const max = Math.max(r,g,b), min = Math.min(r,g,b)
      const light = (max + min) / 510
      const saturation = max === min ? 0 : (max - min) / (255 - Math.abs(max + min - 255))
      if (light < .06 || light > .94) continue
      const key = `${r >> 5}-${g >> 5}-${b >> 5}`
      const item = buckets.get(key) || { r:0,g:0,b:0,n:0,score:0 }
      const weight = .35 + saturation * 1.35 + (1 - Math.abs(light - .48)) * .35
      item.r += r; item.g += g; item.b += b; item.n++; item.score += weight
      buckets.set(key, item)
    }
    const ranked = [...buckets.values()].sort((a,b) => b.score - a.score)
    const first = ranked[0]
    const firstRgb = first ? [first.r,first.g,first.b].map(v => Math.round(v / first.n)) : fallback[0]
    const second = ranked.find(item => {
      const rgb = [item.r,item.g,item.b].map(v => v / item.n)
      return Math.hypot(rgb[0]-firstRgb[0],rgb[1]-firstRgb[1],rgb[2]-firstRgb[2]) > 70
    })
    const secondRgb = second ? [second.r,second.g,second.b].map(v => Math.round(v / second.n)) : fallback[1]
    const palette = [firstRgb, secondRgb]
    state.coverPaletteCache.set(book.id, palette)
    return palette
  } catch {
    state.coverPaletteCache.set(book.id, fallback)
    return fallback
  }
}

function paintCoverFlowBackdrop(book, direction = 0) {
  const layers = $$('.cover-flow-bg')
  if (!layers.length || !book) return
  const nextIndex = state.coverFlowBackdropIndex === 0 ? 1 : 0
  const next = layers[nextIndex]
  const current = layers[state.coverFlowBackdropIndex || 0]
  const apply = (layer, palette) => {
    layer.style.setProperty('--ambient-a', palette[0].join(' '))
    layer.style.setProperty('--ambient-b', palette[1].join(' '))
    const image = layer.querySelector('img')
    if (book.cover) image.src = book.cover
    else image.removeAttribute('src')
  }
  const fallback = fallbackCoverPalette(book)
  apply(next, fallback)
  next.style.setProperty('--drift', `${direction * 34}px`)
  next.classList.remove('is-active')
  requestAnimationFrame(() => {
    current?.classList.remove('is-active')
    next.classList.add('is-active')
    next.style.removeProperty('--drift')
  })
  state.coverFlowBackdropIndex = nextIndex
  state.coverFlowBackdropBookId = book.id
  coverPalette(book).then(palette => {
    if (state.coverFlowBackdropBookId !== book.id) return
    apply($$('.cover-flow-bg')[state.coverFlowBackdropIndex || 0], palette)
    $('#readingHero').style.setProperty('--active-glow', palette[0].join(' '))
  })
}

function layoutCoverFlow(dragX = 0) {
  const stage = $('#coverFlowStage')
  const cards = $$('.cover-flow-card')
  const total = state.coverFlowBooks?.length || 0
  if (!total || !cards.length) return
  const width = stage.clientWidth || innerWidth
  const cardWidth = cards[0].offsetWidth || 220
  const spacing = Math.max(cardWidth * .74, Math.min(width * .225, 270))
  const dragOffset = dragX / spacing
  cards.forEach(card => {
    const base = coverFlowOffset(Number(card.dataset.index), state.coverFlowIndex || 0, total)
    const offset = base + dragOffset
    const abs = Math.abs(offset)
    const side = Math.sign(offset)
    const x = abs <= 1 ? offset * spacing : side * (spacing + (abs - 1) * spacing * .56)
    const y = Math.min(24, abs * 9)
    const rotate = abs < .04 ? 0 : side * -Math.min(48, 35 + Math.max(0, abs - 1) * 5)
    const scale = Math.max(.66, 1.055 - abs * .12)
    const opacity = Math.max(.12, 1 - abs * .205)
    const z = 130 - abs * 92
    const center = abs < .5
    card.style.transform = `translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),${z}px) rotateY(${rotate}deg) scale(${scale})`
    card.style.zIndex = String(100 - Math.round(abs * 10))
    card.style.opacity = String(opacity)
    card.style.filter = abs > 2.4 ? `brightness(${Math.max(.55, 1 - abs * .11)}) saturate(.7)` : `brightness(${Math.max(.72, 1 - abs * .08)}) saturate(${Math.max(.72, 1 - abs * .08)})`
    card.setAttribute('aria-current', center ? 'true' : 'false')
    card.tabIndex = center ? 0 : -1
  })
}

function updateCoverFlowDetails(direction = 0) {
  const source = state.coverFlowBooks || []
  const index = state.coverFlowIndex || 0
  const active = source[index]
  if (!active) return
  const percent = Math.round((active.progress || 0) * 100)
  $('#readingHeroCount').textContent = `${index + 1} / ${source.length}`
  const info = $('#coverFlowInfo')
  info.classList.add('is-changing')
  clearTimeout(state.coverFlowInfoTimer)
  state.coverFlowInfoTimer = setTimeout(() => {
    $('#coverFlowTitle').textContent = active.title
    $('#coverFlowMeta').textContent = `${active.author || '未知作者'} · ${percent ? `已阅读 ${percent}%` : '尚未开始'}`
    $('#coverFlowProgressBar').style.width = `${percent}%`
    $('#coverFlowProgressText').textContent = `${percent}%`
    info.classList.remove('is-changing')
  }, 100)
  $$('.cover-flow-dot').forEach((dot, i) => dot.classList.toggle('active', i === index))
  paintCoverFlowBackdrop(active, direction)
}

function renderCoverFlow() {
  const hero = $('#readingHero')
  const previousId = state.coverFlowBooks?.[state.coverFlowIndex || 0]?.id
  const source = state.books
    .filter(b => b && !b.deletedAt)
    .sort((a, b) => (b.lastRead || b.added || 0) - (a.lastRead || a.added || 0))
    .slice(0, 9)
  if (!source.length) {
    hero.classList.remove('hidden')
    state.coverFlowBooks = []
    state.coverFlowKey = ''
    const stage = $('#coverFlowStage')
    stage.innerHTML = '<div class="cover-flow-empty"><span><span class="empty-icon"><svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><strong>书架还是空的</strong><small>从下方导入一本 EPUB，开始你的本地书库</small></span></div>'
    $('#readingHeroCount').textContent = '0 本'
    $('#coverFlowInfo').classList.add('hidden')
    $('#coverFlowDots').innerHTML = ''
    return
  }
  hero.classList.remove('hidden')
  $('#coverFlowInfo').classList.remove('hidden')
  const nextKey = source.map(book => `${book.id}:${book.updatedAt || 0}:${book.title}:${book.cover?.length || 0}`).join('|')
  const rebuild = state.coverFlowKey !== nextKey
  state.coverFlowBooks = source
  const matchedIndex = source.findIndex(book => book.id === previousId)
  if (matchedIndex >= 0) state.coverFlowIndex = matchedIndex
  else if (!Number.isInteger(state.coverFlowIndex) || state.coverFlowIndex >= source.length) state.coverFlowIndex = 0
  const stage = $('#coverFlowStage')
  if (rebuild) {
    state.coverFlowKey = nextKey
    stage.classList.add('is-preparing')
    stage.innerHTML = ''
    source.forEach((book, i) => {
      const card = document.createElement('button')
      card.type = 'button'
      card.className = 'cover-flow-card'
      card.dataset.index = String(i)
      card.setAttribute('aria-label', `打开《${book.title}》`)
      if (book.cover) {
        const image = document.createElement('img')
        image.src = book.cover
        image.alt = book.title
        card.append(image)
      } else {
        const fallback = document.createElement('span')
        fallback.className = 'cover-flow-fallback'
        fallback.innerHTML = '<small>LOCAL EDITION</small>'
        const title = document.createElement('strong')
        title.textContent = book.title
        fallback.append(title)
        card.append(fallback)
      }
      card.onclick = () => {
        if (state.coverFlowSuppressClick) return
        if (i === state.coverFlowIndex) openBook(book.id)
        else setCoverFlowIndex(i)
      }
      card.oncontextmenu = e => {
        e.preventDefault()
        if (!state.coverFlowSuppressClick) openBookManager(book.id)
      }
      stage.append(card)
    })
    const dots = $('#coverFlowDots')
    dots.innerHTML = ''
    source.forEach((book, i) => {
      const dot = document.createElement('button')
      dot.type = 'button'
      dot.className = 'cover-flow-dot'
      dot.title = book.title
      dot.setAttribute('aria-label', `切换到《${book.title}》`)
      dot.onclick = () => setCoverFlowIndex(i)
      dots.append(dot)
    })
  }
  layoutCoverFlow()
  updateCoverFlowDetails()
  if (rebuild) requestAnimationFrame(() => stage.classList.remove('is-preparing'))
}

function setCoverFlowIndex(index) {
  const total = state.coverFlowBooks?.length || 0
  if (!total) return
  const previous = state.coverFlowIndex || 0
  const next = (index % total + total) % total
  if (next === previous) {
    layoutCoverFlow()
    return
  }
  let direction = next > previous ? 1 : -1
  if (Math.abs(next - previous) > total / 2) direction *= -1
  state.coverFlowIndex = next
  layoutCoverFlow()
  updateCoverFlowDetails(direction)
}

function shiftCoverFlow(delta) {
  setCoverFlowIndex((state.coverFlowIndex || 0) + delta)
}

function bindCoverFlow() {
  const stage = $('#coverFlowStage')
  let pointerId = null
  let startX = 0
  let currentX = 0
  let startedAt = 0
  let captured = false
  const finish = e => {
    if (pointerId === null || (e.pointerId != null && e.pointerId !== pointerId)) return
    const dx = currentX - startX
    const velocity = dx / Math.max(1, performance.now() - startedAt)
    const moved = Math.abs(dx) > 7
    pointerId = null
    captured = false
    stage.classList.remove('is-dragging')
    if (moved) {
      state.coverFlowSuppressClick = true
      setTimeout(() => { state.coverFlowSuppressClick = false }, 0)
    }
    if (Math.abs(dx) > Math.min(90, stage.clientWidth * .1) || Math.abs(velocity) > .45) {
      shiftCoverFlow(dx < 0 ? 1 : -1)
    } else {
      layoutCoverFlow()
    }
  }
  stage.onpointerdown = e => {
    if (e.button !== 0 || pointerId !== null) return
    pointerId = e.pointerId
    startX = currentX = e.clientX
    startedAt = performance.now()
  }
  stage.onpointermove = e => {
    if (e.pointerId !== pointerId) return
    currentX = e.clientX
    const dx = currentX - startX
    if (Math.abs(dx) > 4) {
      stage.classList.add('is-dragging')
      if (!captured) {
        captured = true
        stage.setPointerCapture?.(e.pointerId)
      }
    }
    layoutCoverFlow(dx)
  }
  stage.onpointerup = finish
  stage.onpointercancel = finish
  document.addEventListener('pointerup', finish)
  document.addEventListener('pointercancel', finish)
  document.addEventListener('keydown', e => {
    if ($('#libraryView').classList.contains('hidden')) return
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return
    if ($('#libraryView').scrollTop > innerHeight * .8) return
    if (e.key === 'ArrowLeft') { e.preventDefault(); shiftCoverFlow(-1) }
    if (e.key === 'ArrowRight') { e.preventDefault(); shiftCoverFlow(1) }
    if (e.key === 'Enter' && document.activeElement === stage) {
      const book = state.coverFlowBooks?.[state.coverFlowIndex || 0]
      if (book) openBook(book.id)
    }
  })
  window.addEventListener('resize', () => {
    clearTimeout(state.coverFlowResizeTimer)
    state.coverFlowResizeTimer = setTimeout(() => layoutCoverFlow(), 100)
  })
}

function renderLibrary() {
  const q = $('#librarySearch').value.trim().toLowerCase()
  const sort = $('#librarySort').value
  const filter = $('#libraryFilter').value
  
  state.visibleBooks = state.books.filter(b => 
    (!q || `${b.title} ${b.author}`.toLowerCase().includes(q)) &&
    (filter === 'all' ||
     filter === 'finished' && b.progress >= 0.995 ||
     filter === 'reading' && b.progress > 0 && b.progress < 0.995 ||
     filter === 'unread' && !b.progress)
  )
  
  state.visibleBooks.sort(
    sort === 'title' ? (a, b) => a.title.localeCompare(b.title, 'zh-CN') :
    sort === 'progress' ? (a, b) => (b.progress || 0) - (a.progress || 0) :
    sort === 'added' ? (a, b) => (b.added || 0) - (a.added || 0) :
    (a, b) => (b.lastRead || b.added || 0) - (a.lastRead || a.added || 0)
  )
  
  $('#emptyState').classList.toggle('hidden', !!state.visibleBooks.length)
  $('#emptyState').querySelector('.empty-title').textContent = state.books.length 
    ? '没有匹配的图书' 
    : '导入第一本 EPUB'
  $('#emptyState').querySelector('.empty-description').textContent = state.books.length 
    ? '换一个关键词试试' 
    : '点击这里，或把 EPUB 文件拖到书架'
  
  $('#bookGrid').innerHTML = ''
  renderCoverFlow()
  
  for (const book of state.visibleBooks) {
    const card = document.createElement('article')
    card.className = 'book-card'
    
    card.innerHTML = `
      <button class="delete-book" title="删除" aria-label="删除《${escapeHtml(book.title)}》">
        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m18 6-12 12M6 6l12 12"/>
        </svg>
      </button>
      <div class="cover"></div>
      <div class="card-title" title="${escapeHtml(book.title)}">${escapeHtml(book.title)}</div>
    `
    const meta = document.createElement('div')
    meta.className = 'card-meta'
    meta.textContent = `${book.author} · ${Math.round((book.progress || 0) * 100)}%`
    card.append(meta)
    const cover = card.querySelector('.cover')
    if (book.cover) {
      const img = document.createElement('img')
      img.src = book.cover
      img.alt = ''
      cover.append(img)
    } else {
      const fallback = document.createElement('div')
      fallback.className = 'cover-fallback'
      fallback.textContent = book.title
      cover.append(fallback)
    }
    
    card.querySelector('.cover').onclick = () => openBook(book.id)
    card.querySelector('.cover').oncontextmenu = (e) => {
      e.preventDefault()
      openBookManager(book.id)
    }
    
    card.querySelector('.card-title').onclick = () => openBookManager(book.id)
    card.querySelector('.card-title').style.cursor = 'pointer'
    card.querySelector('.card-title').title = `管理《${book.title}》`
    
    card.querySelector('.delete-book').onclick = async () => {
      if (confirm(`从本地书架删除《${book.title}》？`)) {
        await removeBook(book.id)
        loadLibrary()
      }
    }
    
    $('#bookGrid').append(card)
  }
}

// ==================== Backup & Export ====================
function backupBook(book) {
  const clean = normalizeBook({ ...book, data: toBase64(book.data) })
  delete clean.locatorAt
  return clean
}

async function exportData() {
  try {
    const books = await getBooks()
    const now = new Date()
    downloadText(
      `reader-backup-${now.toISOString().slice(0, 10)}.json`,
      JSON.stringify({
        format: 'local-epub-reader-backup',
        version: 4,
        exportedAt: now.toISOString(),
        books: books.map(backupBook)
      }, null, 2),
      'application/json'
    )
    toast(`已导出 ${books.length} 本图书的完整备份`)
  } catch (e) {
    toast(`备份失败：${e.message}`, 4500)
  }
}

async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text())
    
    if (data?.format !== 'local-epub-reader-backup' || 
        ![3, 4].includes(+data.version) || 
        !Array.isArray(data.books)) {
      throw new Error('format')
    }
    
    const incoming = []
    
    for (const raw of data.books) {
      if (!raw || typeof raw !== 'object' || typeof raw.data !== 'string') continue
      
      const bytes = fromBase64(raw.data)
      await parseEpub(bytes)
      
      const book = normalizeBook({ ...raw, data: bytes })
      book.id ||= uid()
      book.size ||= bytes.byteLength
      book.hash ||= await fileHash(bytes)
      incoming.push(book)
    }
    
    if (!incoming.length) throw new Error('empty')
    
    const existing = await getBooks()
    const db = await dbp
    await new Promise((resolve, reject) => {
      const tx = db.transaction('books', 'readwrite')
      const s = tx.objectStore('books')
      for (const book of incoming) {
        const same = existing.find(x => x.hash && book.hash && x.hash === book.hash)
        if (same) {
          const notes = new Map((same.notes || []).map(n => [n.id, n]))
          for (const note of book.notes || []) {
            const currentNote = notes.get(note.id)
            if (!currentNote ||
                (note.updated || note.created || 0) >=
                (currentNote.updated || currentNote.created || 0)) {
              notes.set(note.id, note)
            }
          }
          const incomingIsNewer = (book.lastRead || 0) > (same.lastRead || 0)
          const incomingSettingsAreNewer =
            (book.settingsUpdatedAt || 0) > (same.settingsUpdatedAt || 0)
          const merged = normalizeBook({
            ...same,
            ...book,
            id: same.id,
            chapter: incomingIsNewer ? book.chapter : same.chapter,
            page: incomingIsNewer ? book.page : same.page,
            scrollTop: incomingIsNewer ? book.scrollTop : same.scrollTop,
            progress: incomingIsNewer ? book.progress : same.progress,
            locator: incomingIsNewer ? book.locator : same.locator,
            notes: [...notes.values()],
            settings: incomingSettingsAreNewer ? book.settings : same.settings,
            settingsUpdatedAt: Math.max(
              same.settingsUpdatedAt || 0,
              book.settingsUpdatedAt || 0
            ),
            lastRead: Math.max(same.lastRead || 0, book.lastRead || 0),
            revision: Math.max(same.revision || 0, book.revision || 0) + 1
          })
          s.put(merged)
        } else {
          s.put(book)
        }
      }
      tx.oncomplete = resolve
      tx.onerror = () => reject(tx.error)
      tx.onabort = () => reject(tx.error)
    })
    
    await loadLibrary()
    broadcastLibraryChange('*')
    toast(`已验证并恢复 ${incoming.length} 本图书`)
  } catch (e) {
    toast('备份无效或内容已损坏，未写入任何数据', 4800)
  }
}

// ==================== Reader Core ====================
async function openBook(id) {
  const openBookToken = ++state.openBookToken
  try {
    const book = state.books.find((b) => b.id === id) ||
      (await getBooks()).find((b) => b.id === id)
    if (openBookToken !== state.openBookToken) return
    if (!book) throw new Error('找不到这本书')
    const nextBook = normalizeBook({ ...book })
    nextBook.lastRead = Date.now()
    const nextEpub = await parseEpub(nextBook.data)
    if (openBookToken !== state.openBookToken) return
    
    state.book = nextBook
    state.epub = nextEpub
    state.fixedViewport = null
    state.renderToken = 0
    state.externalChange = false
    state.chapter = Math.max(0, Math.min(
      state.book.locator?.chapter ?? state.book.chapter ?? 0,
      state.epub.spine.length - 1
    ))
    state.page = state.book.page || 0
    state.continuousStartChapter = state.chapter
    state.continuousLastChapter = state.chapter
    state.continuousLoading = false
    state.searchIndex = null
    state.returnLocator = null
    state.chapterLoadGeneration = (state.chapterLoadGeneration || 0) + 1
    
    document.documentElement.classList.remove('library-mode')
    $('#libraryView').classList.add('hidden')
    $('#readerView').classList.remove('hidden')
    
    document.documentElement.classList.add('fullscreen-reading')
    applyBookTheme()
    
    renderToc()
    renderNotes()
    
    await renderChapter(state.chapter, '', state.page, { locator: state.book.locator })
  } catch (e) {
    if (openBookToken !== state.openBookToken) return
    clearUrls()
    state.book = null
    state.epub = null
    document.documentElement.classList.remove('fullscreen-reading')
    document.documentElement.classList.add('library-mode')
    $('#readerView').classList.add('hidden')
    $('#libraryView').classList.remove('hidden')
    toast(`图书打开失败：${e.message}`, 4500)
  }
}

async function renderChapter(index, fragment = '', initialPage = 0, options = {}) {
  if (!state.epub || index < 0 || index >= state.epub.spine.length) return
  
  const renderToken = ++state.renderToken
  const chapterLoadGeneration = ++state.chapterLoadGeneration
  const restoreScroll = index === state.book.chapter 
    ? (state.book.scrollTop || 0) 
    : (initialPage > 1000 ? Number.MAX_SAFE_INTEGER : 0)
  
  state.chapter = index
  state.continuousStartChapter = index
  state.continuousLastChapter = index
  state.continuousLoading = false
  state.page = Math.max(0, initialPage)
  clearUrls()
  
  const path = state.epub.spine[index]
  const text = await state.epub.zip.text(path)
  if (!text) throw new Error('章节文件缺失')
  
  const doc = new DOMParser().parseFromString(text, 'application/xhtml+xml')
  if (doc.querySelector('parsererror') || !doc.body) {
    throw new Error('章节内容损坏或格式不受支持')
  }
  sanitizeEpubDocument(doc)
  
  state.chapterDirection = (
    doc.body.getAttribute('dir') || 
    doc.documentElement.getAttribute('dir') || 
    ''
  ).toLowerCase()
  
  if (state.epub.fixedLayout) {
    const content = doc.querySelector('meta[name="viewport"]')?.getAttribute('content') || ''
    const width = +(content.match(/(?:^|[,;\s])width\s*=\s*([\d.]+)/i)?.[1] || 0)
    const height = +(content.match(/(?:^|[,;\s])height\s*=\s*([\d.]+)/i)?.[1] || 0)
    const viewBox = (doc.querySelector('svg[viewBox]')?.getAttribute('viewBox') || '')
      .trim()
      .split(/[\s,]+/)
      .map(Number)
    
    state.fixedViewport = {
      width: width || (viewBox.length === 4 && viewBox[2]) || 800,
      height: height || (viewBox.length === 4 && viewBox[3]) || 1200
    }
  }
  
  await rewriteDocumentResources(doc, path)
  if (renderToken !== state.renderToken || chapterLoadGeneration !== state.chapterLoadGeneration) return

  const chapterMarker = doc.createElement('div')
  chapterMarker.className = 'continuous-chapter'
  chapterMarker.dataset.chapterIndex = String(index)
  chapterMarker.dataset.chapterPath = path
  doc.body.prepend(chapterMarker)
  
  for (const el of [...doc.querySelectorAll('a[href]')]) {
    const href = el.getAttribute('href')
    if (!href || /^(https?:|mailto:)/i.test(href)) {
      el.removeAttribute('href')
      continue
    }
    
    const target = resolvePath(path, href)
    const type = el.getAttribute('epub:type') || 
                 el.getAttributeNS('http://www.idpf.org/2007/ops', 'type') || 
                 el.getAttribute('role') || ''
    
    el.setAttribute('href', '#')
    el.setAttribute('data-epub-href', target)
    el.setAttribute('data-epub-type', type)
  }
  
  const settings = getSettings()
  const injected = doc.createElement('style')
  injected.id = 'reader-runtime-style'
  injected.textContent = buildReaderCss(settings)
  doc.head?.append(injected)
  
  const frame = $('#readerFrame')
  const source = new XMLSerializer().serializeToString(doc)
  await new Promise((resolve, reject) => {
    let settled = false
    const finish = (error) => {
      if (settled) return
      settled = true
      clearTimeout(timeout)
      frame.removeEventListener('load', handleLoad)
      frame.removeEventListener('error', handleError)
      error ? reject(error) : resolve()
    }
    const timeout = setTimeout(() => finish(new Error('章节页面加载超时')), 15000)
    const handleError = () => {
      finish(new Error('章节页面加载失败'))
    }
    const handleLoad = () => (async () => {
      if (renderToken !== state.renderToken || chapterLoadGeneration !== state.chapterLoadGeneration) {
        finish()
        return
      }
      
      const idoc = frame.contentDocument
      const win = frame.contentWindow
      if (!idoc?.body || !win) {
        finish(new Error('章节页面未能建立可访问的正文文档'))
        return
      }
      
      idoc.addEventListener('mouseup', (e) => {
        state.selectionNoteId = ''
        captureSelection(e)
      })
      
      idoc.addEventListener('touchend', (e) => {
        state.selectionNoteId = ''
        captureSelection(e)
      })
      
      idoc.addEventListener('keydown', handleReadingKey)
      
      idoc.addEventListener('click', (e) => {
        const a = e.target.closest('[data-epub-href]')
        if (a) {
          e.preventDefault()
          if (a.dataset.epubType?.includes('noteref') || 
              isFootnoteTarget(a.dataset.epubHref, idoc)) {
            showFootnote(a.dataset.epubHref)
          } else {
            goHref(a.dataset.epubHref)
          }
          return
        }
        
        const img = e.target.closest('img,svg')
        if (img && openImageViewer(img)) {
          e.preventDefault()
          return
        }
        
        if (!win.getSelection().toString() && 
            !e.target.closest('a,button,input,select,textarea')) {
          handleReaderTap(e.clientX, frame.clientWidth)
        }
      })
      
      idoc.addEventListener('touchend', (e) => {
        if (state.epub.fixedLayout) return
        // Reflowable books use the browser's native vertical scroll. Do not turn
        // horizontal gestures into chapter jumps on phones.
        ensureContinuousContent().catch(() => {})
      }, { passive: true })
      
      idoc.addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaY) < 24) return
        
        if (state.epub.fixedLayout) {
          e.preventDefault()
          clearTimeout(state.wheelTimer)
          state.wheelTimer = setTimeout(() => {
            navigateReading(e.deltaY > 0 ? 1 : -1).catch(error => toast(`翻页失败：${error.message}`, 3500))
          }, 80)
          return
        }
        
        if (isScrollMode() && e.deltaY > 0) {
          ensureContinuousContent().catch(() => {})
        }
      }, { passive: false })
      
      for (const media of idoc.querySelectorAll('img,video,audio,object,embed')) {
        media.addEventListener('error', () => media.remove(), { once: true })
        if (media.tagName === 'IMG' && media.complete && media.naturalWidth === 0) {
          media.remove()
        }
      }
      
      applyHighlights(idoc)
      
      try {
        await idoc.fonts?.ready
      } catch {}
      
      await waitForDocumentImages(idoc)
      if (renderToken !== state.renderToken || chapterLoadGeneration !== state.chapterLoadGeneration) {
        finish()
        return
      }
      
      requestAnimationFrame(() => {
        if (renderToken !== state.renderToken || chapterLoadGeneration !== state.chapterLoadGeneration) {
          finish()
          return
        }
        
        const fragmentTarget = fragment ? idoc.getElementById(fragment) : null
        
        if (state.epub.fixedLayout) {
          state.pageCount = 1
          state.page = 0
          win.scrollTo(0, 0)
        } else {
          state.pageCount = 1
          if (fragmentTarget) {
            fragmentTarget.scrollIntoView({ block: 'start' })
          } else if (options.locator && options.locator.chapter === index) {
            scrollToLocator(idoc, options.locator)
          } else {
            win.scrollTo(0, restoreScroll)
          }
          state.book.scrollTop = win.scrollY
          win.addEventListener('scroll', handleReaderScroll, { passive: true })
        }
        
        state.autoChapterReadyAt = Date.now() + 500
        updateReadingProgress()
        saveCurrentBook()
        focusPendingNote()
        state.navigating = false
        
        finish()
      })
    })().catch(error => finish(error instanceof Error ? error : new Error(String(error))))
    frame.addEventListener('error', handleError)
    frame.addEventListener('load', handleLoad)
    frame.srcdoc = source
  })
  
  state.book.chapter = index
  state.book.page = state.page
  await saveCurrentBook()
  markToc()
}

function handleReaderScroll() {
  const win = $('#readerFrame').contentWindow
  state.book.scrollTop = win.scrollY
  updateContinuousChapter()
  updateReadingProgress()
  ensureContinuousContent().catch(e => toast(`下一章加载失败：${e.message}`, 3500))

  clearTimeout(handleReaderScroll.timer)
  handleReaderScroll.timer = setTimeout(() => {
    state.book.locator = captureReadingLocator()
    saveCurrentBook()
  }, 250)
}
function currentContinuousChapter(doc = $('#readerFrame').contentDocument) {
  const win = $('#readerFrame').contentWindow
  const markers = [...doc.querySelectorAll('[data-chapter-index]')]
  const y = (win?.scrollY || 0) + Math.max(24, $('#readerFrame').clientHeight * 0.18)
  let current = state.continuousStartChapter ?? state.chapter
  for (const marker of markers) {
    if (marker.offsetTop <= y) current = Number(marker.dataset.chapterIndex) || current
  }
  return Math.max(0, Math.min(state.epub.spine.length - 1, current))
}

async function appendNextChapter() {
  if (!state.epub || state.epub.fixedLayout || state.continuousLoading) return false
  const loadedCount = $('#readerFrame').contentDocument?.querySelectorAll('[data-chapter-index]').length || 0
  if (loadedCount >= 24) return false
  const nextIndex = (state.continuousLastChapter ?? state.chapter) + 1
  if (nextIndex >= state.epub.spine.length) return false

  state.continuousLoading = true
  const generation = state.chapterLoadGeneration
  try {
    const path = state.epub.spine[nextIndex]
    const text = await state.epub.zip.text(path)
    if (!text) throw new Error('章节文件缺失')
    const doc = new DOMParser().parseFromString(text, 'application/xhtml+xml')
    if (doc.querySelector('parsererror') || !doc.body) throw new Error('章节内容损坏')
    sanitizeEpubDocument(doc)
    await rewriteDocumentResources(doc, path)
    if (generation !== state.chapterLoadGeneration) return false
    for (const el of [...doc.querySelectorAll('a[href]')]) {
      const href = el.getAttribute('href')
      if (!href || /^(https?:|mailto:)/i.test(href)) {
        el.removeAttribute('href')
        continue
      }
      el.setAttribute('href', '#')
      el.setAttribute('data-epub-href', resolvePath(path, href))
      el.setAttribute('data-epub-type', el.getAttribute('epub:type') || el.getAttribute('role') || '')
    }

    const idoc = $('#readerFrame').contentDocument
    for (const sourceStyle of doc.head?.querySelectorAll('style') || []) {
      const style = idoc.createElement('style')
      style.textContent = sourceStyle.textContent
      idoc.head.append(style)
    }
    const section = idoc.createElement('section')
    section.className = 'continuous-chapter'
    section.dataset.chapterIndex = String(nextIndex)
    section.dataset.chapterPath = path
    for (const child of [...doc.body.childNodes]) {
      section.append(idoc.importNode(child, true))
    }
    idoc.body.append(section)
    applyNotesToSection(section, nextIndex)
    state.continuousLastChapter = nextIndex
    return true
  } finally {
    state.continuousLoading = false
  }
}

async function ensureContinuousContent() {
  if (!state.epub || state.epub.fixedLayout) return
  const frame = $('#readerFrame')
  const win = frame.contentWindow
  const doc = frame.contentDocument
  const max = Math.max(0, doc.documentElement.scrollHeight - frame.clientHeight)
  if (win.scrollY >= max - Math.max(180, frame.clientHeight * 0.7)) {
    await appendNextChapter()
  }
}

function continuousChapterRatio() {
  if (!state.epub || state.epub.fixedLayout) return chapterRatio()
  const doc = $('#readerFrame').contentDocument
  const win = $('#readerFrame').contentWindow
  const markers = [...doc.querySelectorAll('[data-chapter-index]')]
  const current = state.chapter
  const marker = markers.find(el => Number(el.dataset.chapterIndex) === current)
  const next = markers.find(el => Number(el.dataset.chapterIndex) === current + 1)
  if (!marker) return chapterRatio()
  const start = marker.offsetTop
  const end = next ? next.offsetTop : doc.documentElement.scrollHeight
  return Math.max(0, Math.min(1, ((win.scrollY || 0) - start) / Math.max(1, end - start - $('#readerFrame').clientHeight)))
}

function updateContinuousChapter() {
  if (!state.epub || state.epub.fixedLayout) return
  state.chapter = currentContinuousChapter()
  state.book.chapter = state.chapter
  state.book.progress = Math.min(1, (state.chapter + continuousChapterRatio()) / state.epub.spine.length)
  state.book.lastRead = Date.now()
  markToc()
}

async function waitForDocumentImages(doc) {
  const images = [...doc.images].filter(img => !img.complete)
  if (!images.length) return
  
  await Promise.race([
    Promise.all(images.map(img => new Promise(resolve => {
      img.addEventListener('load', resolve, { once: true })
      img.addEventListener('error', resolve, { once: true })
    }))),
    new Promise(resolve => setTimeout(resolve, 1800))
  ])
}

function chapterRatio() {
  const frame = $('#readerFrame')
  if (state.epub?.fixedLayout) {
    return state.chapter === state.epub.spine.length - 1 ? 1 : 0
  }
  
  const doc = frame.contentDocument
  const max = Math.max(1, doc?.documentElement.scrollHeight - frame.clientHeight)
  return Math.min(1, (frame.contentWindow?.scrollY || 0) / max)
}

function updateReadingProgress() {
  if (!state.book || !state.epub) return
  
  const ratio = state.epub.fixedLayout ? chapterRatio() : continuousChapterRatio()
  const total = state.epub.spine.length
  state.book.progress = Math.min(1, (state.chapter + ratio) / total)
  
  if (state.epub.fixedLayout && state.chapter === total - 1) {
    state.book.progress = 1
  }
  
  state.book.chapter = state.chapter
  state.book.page = state.page
  
  if (!state.book.locator || 
      !state.book.locatorAt || 
      Date.now() - state.book.locatorAt > 260) {
    state.book.locator = captureReadingLocator()
    state.book.locatorAt = Date.now()
  }
  
  state.book.lastRead = Date.now()
  
}

function showReadingStatus(ms = 1250) {
  if (!state.book || !state.epub) return
  
  $('#readingStatusChapter').textContent = chapterLabel(state.chapter)
  $('#readingStatusPage').textContent = '滚动阅读'
  $('#readingStatusProgress').textContent = `全书 ${Math.round((state.book.progress || 0) * 100)}%`
  
  const box = $('#readingStatus')
  box.classList.add('visible')
  
  clearTimeout(state.statusTimer)
  state.statusTimer = setTimeout(() => box.classList.remove('visible'), ms)
}

async function navigateReading(delta) {
  if (state.navigating || !state.book || !state.epub) return
  
  const frame = $('#readerFrame')
  const win = frame.contentWindow
  
  if (!state.epub.fixedLayout) {
    await ensureContinuousContent()
    const doc = frame.contentDocument
    const step = frame.clientHeight * 0.82
    const max = doc.documentElement.scrollHeight - frame.clientHeight
    const target = win.scrollY + delta * step
    if (target >= 0 && target <= max + 5) {
      win.scrollTo({ top: Math.max(0, target), behavior: 'smooth' })
      return true
    }
    if (delta < 0 && state.chapter > 0) {
      state.navigating = true
      try {
        await renderChapter(state.chapter - 1, '', 99999)
        showReadingStatus(1500)
        return true
      } catch (error) {
        state.navigating = false
        toast(`上一章打开失败：${error.message}`, 3500)
      }
    }
    return false
  }
  
  const chapter = state.chapter + delta
  if (chapter >= 0 && chapter < state.epub.spine.length) {
    state.navigating = true
    try {
      await renderChapter(chapter, '', delta < 0 ? 99999 : 0)
      showReadingStatus(1500)
    } catch (e) {
      state.navigating = false
      toast(`章节打开失败：${e.message}`)
    }
  }
}

function isScrollMode() {
  return !!state.epub && !state.epub.fixedLayout && getSettings().mode === 'scroll'
}

function saveReadingPosition() {
  if (!state.book || !state.epub) return
  state.book.locator = captureReadingLocator()
  state.book.lastRead = Date.now()
  return saveCurrentBook()
}
// ==================== Locator System ====================
function textMap(root) {
  const doc = root.ownerDocument
  const walker = doc.createTreeWalker(root, doc.defaultView.NodeFilter.SHOW_TEXT)
  let node
  let total = 0
  const nodes = []
  
  while (node = walker.nextNode()) {
    nodes.push({ node, start: total, end: total + node.data.length })
    total += node.data.length
  }
  
  return { nodes, total }
}

function captureReadingLocator() {
  const frame = $('#readerFrame')
  const doc = frame.contentDocument
  
  if (!doc?.body) {
    return state.book?.locator || { chapter: state.chapter, offset: 0, ratio: chapterRatio() }
  }
  
  const map = textMap(doc.body)
  const viewportX = Math.max(12, frame.clientWidth * 0.08)
  const viewportY = Math.max(12, frame.clientHeight * 0.08)
  let best = null
  
  for (const item of map.nodes) {
    if (!item.node.data.trim()) continue
    
    const range = doc.createRange()
    range.selectNodeContents(item.node)
    const rect = [...range.getClientRects()].find(r => 
      r.bottom > viewportY && r.top < frame.clientHeight - viewportY
    )
    
    if (rect) {
      best = item
      break
    }
  }
  
  const offset = best?.start ?? Math.round(map.total * chapterRatio())
  const text = doc.body.textContent || ''
  
  return {
    chapter: state.chapter,
    offset,
    ratio: chapterRatio(),
    before: text.slice(Math.max(0, offset - 32), offset),
    after: text.slice(offset, offset + 64),
    scrollTop: frame.contentWindow?.scrollY || 0
  }
}

function resolveLocatorOffset(doc, locator) {
  const text = doc.body?.textContent || ''
  
  if (locator?.after) {
    const candidates = []
    let from = 0
    
    while ((from = text.indexOf(locator.after, from)) >= 0) {
      candidates.push(from)
      from += Math.max(1, locator.after.length)
    }
    
    if (candidates.length) {
      const expected = Number.isFinite(locator.offset) 
        ? locator.offset 
        : Math.round((locator.ratio || 0) * text.length)
      return candidates.sort((a, b) => Math.abs(a - expected) - Math.abs(b - expected))[0]
    }
    
    if (locator.before) {
      const b = text.lastIndexOf(
        locator.before, 
        Math.max(0, (locator.offset || 0) + locator.before.length + 256)
      )
      if (b >= 0) return b + locator.before.length
    }
  }
  
  return Math.max(0, Math.min(text.length, locator?.offset || 0))
}

function nodeAtTextOffset(doc, offset) {
  const map = textMap(doc.body)
  return map.nodes.find(x => x.end >= offset) || map.nodes.at(-1)
}

function scrollToLocator(doc, locator) {
  const item = nodeAtTextOffset(doc, resolveLocatorOffset(doc, locator))
  if (item?.node.parentElement) {
    item.node.parentElement.scrollIntoView({ block: 'start' })
  } else {
    doc.defaultView.scrollTo(0, locator?.scrollTop || 0)
  }
}

// ==================== Navigation ====================
function renderToc() {
  $('#tocPanel').innerHTML = ''
  
  state.epub.toc.forEach((item) => {
    const b = document.createElement('button')
    b.className = 'toc-item'
    b.textContent = item.label
    b.dataset.href = item.href
    b.onclick = () => goHref(item.href).catch(error => toast(`章节打开失败：${error.message}`, 3500))
    $('#tocPanel').append(b)
  })
  
  markToc()
}

function markToc() {
  $$('.toc-item').forEach((b) => {
    b.classList.toggle(
      'active',
      b.dataset.href.split('#')[0] === state.epub.spine[state.chapter]
    )
  })
}

async function goHref(href) {
  const [path, frag] = href.split('#')
  let i = state.epub.spine.indexOf(path)
  
  if (i < 0) {
    i = state.epub.spine.findIndex((p) => p.endsWith(path))
  }
  
  if (i >= 0) {
    state.navigating = true
    try {
      await renderChapter(i, frag)
    } catch (error) {
      state.navigating = false
      toast(`章节打开失败：${error.message}`, 3500)
    }
  }
}

function isFootnoteTarget(href, doc) {
  const [path, frag] = href.split('#')
  if (!frag || path !== state.epub.spine[state.chapter]) return false
  
  let el = doc.getElementById(frag)
  while (el) {
    const type = el.getAttribute?.('epub:type') || 
                 el.getAttributeNS?.('http://www.idpf.org/2007/ops', 'type') || ''
    
    if (type.split(/\s+/).includes('footnote') || 
        el.getAttribute?.('role') === 'doc-footnote' || 
        el.tagName?.toLowerCase() === 'aside') {
      return true
    }
    
    el = el.parentElement
  }
  
  return false
}

async function showFootnote(href) {
  const [path, frag] = href.split('#')
  let doc
  
  if (path === state.epub.spine[state.chapter]) {
    doc = $('#readerFrame').contentDocument
  } else {
    const raw = await state.epub.zip.text(path)
    if (!raw) {
      await goHref(href)
      return
    }
    doc = new DOMParser().parseFromString(raw, 'application/xhtml+xml')
    if (doc.body) await rewriteDocumentResources(doc, path)
  }
  
  const target = frag && doc?.getElementById(frag)
  if (!target) {
    await goHref(href)
    return
  }
  
  const clone = target.cloneNode(true)
  clone.querySelectorAll('script,style,link,iframe,form,input,button,object,embed,audio,video')
    .forEach(el => el.remove())
  
  for (const el of [clone, ...clone.querySelectorAll('*')]) {
    for (const attr of [...el.attributes]) {
      if (/^on/i.test(attr.name) || attr.name === 'srcdoc') {
        el.removeAttribute(attr.name)
      }
    }
  }
  
  clone.querySelectorAll('a').forEach(a => a.replaceWith(...a.childNodes))
  
  const box = $('#footnoteContent')
  box.replaceChildren(...clone.childNodes)
  $('#footnoteDialog').showModal()
}

function chapterLabel(index) {
  const path = state.epub?.spine[index]
  const exact = state.epub?.toc.find(x => x.href.split('#')[0] === path)
  return exact?.label || `第 ${index + 1} 章`
}

// ==================== Reader UI Controls ====================
function closeReaderDrawer() {
  const side = $('#sidebar')
  side.classList.remove('open')
  side.dataset.panel = ''
  $('#drawerBackdrop').classList.remove('visible')
}

function handleReaderTap(x, width) {
  const side = $('#sidebar')
  if (side.classList.contains('open')) {
    closeReaderDrawer()
    return
  }
  
  const ratio = x / Math.max(1, width)
  if (ratio < 0.28) {
    navigateReading(state.epub?.direction === 'rtl' ? 1 : -1).catch(error => toast(`翻页失败：${error.message}`, 3500))
    return
  }
  if (ratio > 0.72) {
    navigateReading(state.epub?.direction === 'rtl' ? -1 : 1).catch(error => toast(`翻页失败：${error.message}`, 3500))
    return
  }
}

function openImageViewer(media) {
  const rect = media.getBoundingClientRect()
  if (Math.max(rect.width, rect.height) < 48) return false
  
  const tag = (media.localName || media.tagName || '').toLowerCase()
  let src = ''
  
  if (tag === 'img') {
    src = media.currentSrc || media.src
  } else if (tag === 'svg') {
    try {
      src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(
        new XMLSerializer().serializeToString(media)
      )}`
    } catch {}
  }
  
  if (!src) return false
  
  $('#imageViewerImg').src = src
  $('#imageViewer').classList.remove('hidden')
  return true
}

function closeImageViewer() {
  $('#imageViewer').classList.add('hidden')
  $('#imageViewerImg').removeAttribute('src')
}

async function home() {
  state.openBookToken++
  if (state.book) {
    try {

    } catch {

    }
  }

  state.searchToken = (state.searchToken || 0) + 1

function handleReadingKey(e) {
  const target = e.target
  const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(target?.tagName) || target?.isContentEditable
  if ((e.ctrlKey || e.metaKey) && !e.altKey) {
    const key = e.key.toLowerCase()

    if (key === 'f' && state.book && !isTyping) {
      e.preventDefault()
      $('#searchDialog').showModal()
      $('#searchInput').focus()
      return
    }

    if (key === 'e' && state.book && !isTyping) {
      e.preventDefault()
      $('#exportDialog').showModal()
      return
    }

    if (key === 'z' && state.book) {
      e.preventDefault()
      undoLastNoteAction()
      return
    }
  }

  if (e.key === 'Enter' && state.selection && !isTyping && !e.ctrlKey && !e.metaKey) {
    e.preventDefault()
    addNote('marker')
    return
  }

  if (e.key === 'Escape') {
    const dialog = $('dialog[open]')
    if (dialog) {
      e.preventDefault()
      dialog.close()
      return
    }
    
    if (!$('#imageViewer').classList.contains('hidden')) {
      e.preventDefault()
      closeImageViewer()
      return
    }
    
    if (state.selection || !$('#selectionBar').classList.contains('hidden')) {
      e.preventDefault()
      hideSelectionTools()
      return
    }
    
    if ($('#sidebar').classList.contains('open')) {
      e.preventDefault()
      closeReaderDrawer()
      return
    }
  }
  
  if (!state.book ||
      $('dialog[open]') ||
      e.defaultPrevented ||
      e.metaKey ||
      e.ctrlKey ||
      e.altKey) return
  
  const currentTarget = e.target
  const tag = currentTarget?.tagName
  
  if (['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(tag) || 
      currentTarget?.isContentEditable) return
  
  if (e.key === 'ArrowLeft' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) {
    e.preventDefault()
    navigateReading(state.epub?.direction === 'rtl' ? 1 : -1).catch(error => toast(`翻页失败：${error.message}`, 3500))
  } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
    e.preventDefault()
    navigateReading(state.epub?.direction === 'rtl' ? -1 : 1).catch(error => toast(`翻页失败：${error.message}`, 3500))
  }
}
// ==================== Notes & Highlights ====================
function captureSelection() {
  clearTimeout(state.selectionTimer)
  state.selectionTimer = setTimeout(() => {
    const frame = $('#readerFrame')
    const sel = frame.contentWindow.getSelection()
    const text = sel?.toString().trim()
    const bar = $('#selectionBar')
    
    state.selection = text || ''
    bar.classList.toggle('hidden', !text)
    
    if (!text || !sel.rangeCount) return
    
    const rect = sel.getRangeAt(0).getBoundingClientRect()
    const frameRect = frame.getBoundingClientRect()
    const stageRect = $('.reading-stage').getBoundingClientRect()
    
    const barWidth = bar.offsetWidth || 260
    const barHeight = bar.offsetHeight || 42
    const selectionTop = frameRect.top - stageRect.top + rect.top
    const selectionBottom = frameRect.top - stageRect.top + rect.bottom
    const spaceBelow = stageRect.height - selectionBottom
    const spaceAbove = selectionTop
    const preferBelow = spaceBelow >= barHeight + 16
    const useBelow = preferBelow || spaceBelow >= spaceAbove
    const half = barWidth / 2 + 10
    const left = Math.max(
      half,
      Math.min(
        stageRect.width - half,
        frameRect.left - stageRect.left + rect.left + rect.width / 2
      )
    )
    const rawTop = useBelow
      ? selectionBottom + 12
      : selectionTop - barHeight - 12
    const top = Math.max(10, Math.min(stageRect.height - barHeight - 10, rawTop))
    
    bar.dataset.placement = useBelow ? 'below' : 'above'
    bar.style.left = `${left}px`
    bar.style.top = `${top}px`
    
    syncSelectionActions()
  }, 280)
}

function selectedTextPosition() {
  const sel = $('#readerFrame').contentWindow?.getSelection()
  return sel?.rangeCount 
    ? textOffset(
        $('#readerFrame').contentDocument.body,
        sel.getRangeAt(0).startContainer,
        sel.getRangeAt(0).startOffset
      )
    : -1
}

function textOffset(root, node, offset) {
  const doc = root.ownerDocument
  const range = doc.createRange()
  
  try {
    range.selectNodeContents(root)
    range.setEnd(node, offset)
    return range.toString().length
  } catch {
    return -1
  }
}

function matchingNotes(kind, quote = state.selection) {
  const notes = state.book.notes || []
  const focused = state.selectionNoteId && 
    notes.find(n => n.id === state.selectionNoteId && (n.kind || 'marker') === kind)
  
  if (focused) return [focused]
  
  const position = selectedTextPosition()
  return notes.filter(n => 
    n.chapter === state.chapter &&
    (n.kind || 'marker') === kind &&
    n.quote === quote &&
    (position < 0 || n.position < 0 || Math.abs(n.position - position) <= 1)
  )
}

function matchingNote(kind, quote = state.selection) {
  return matchingNotes(kind, quote)[0]
}

function syncSelectionActions() {
  const note = matchingNote('marker')
  $('#noteBtn').classList.toggle('active', !!note)
  const color = note?.color || getSettings().highlightColor || 'yellow'
  $('.selection-color-dot').style.background = getHighlightColorValue(color)
}

function addRemark() {

  await addNote('remark', value)

}

async function addNote(kind = 'marker', noteText = '') {
  if (!state.selection) return
  const existing = matchingNotes(kind)
  if (existing.length) {
    const ids = new Set(existing.map(n => n.id))
    state.book.notes = state.book.notes.filter(n => !ids.has(n.id))
    await saveCurrentBook()
    for (const id of ids) {
      const marked = $('#readerFrame').contentDocument.querySelectorAll(`[data-note="${CSS.escape(id)}"]`)
      for (const el of marked) el.replaceWith(...el.childNodes)
    }
    $('#readerFrame').contentWindow.getSelection()?.removeAllRanges()
    state.selection = ''
    state.selectionNoteId = ''
    $('#selectionBar').classList.add('hidden')
    renderNotes()
    toast('已删除笔记')
    return
  }

  const selectedRange = (() => {
    const sel = $('#readerFrame').contentWindow?.getSelection()
    return sel?.rangeCount ? sel.getRangeAt(0).cloneRange() : null
  })()
  const position = selectedTextPosition()
  const bodyText = $('#readerFrame').contentDocument.body.textContent || ''
  const item = {
    id: uid(), chapter: state.chapter, quote: state.selection, note: noteText,
    kind, position,
    before: bodyText.slice(Math.max(0, position - 32), position),
    after: bodyText.slice(position + state.selection.length, position + state.selection.length + 32),
    color: getSettings().highlightColor || 'yellow', created: Date.now(), updated: Date.now()
  }
  state.book.notes ||= []
  state.book.notes.push(item)
  state.lastNoteAction = { type: 'add', id: item.id }
  const highlighted = highlightSelectionRange(selectedRange, item.id, item)
  if (highlighted === 0) {
    const fallback = highlightFirst($('#readerFrame').contentDocument.body, item.quote, item.id, item.kind, item.position, item)
    if (!fallback) {
      state.book.notes = state.book.notes.filter(n => n.id !== item.id)
      state.lastNoteAction = null
      renderNotes()
      toast('笔记未能标注，请重新选择文字', 3500)
      return
    }
  }
  try {
    await saveCurrentBook()
  } catch (error) {
    $('#readerFrame').contentDocument?.querySelectorAll(`[data-note="${CSS.escape(item.id)}"]`).forEach(el => el.replaceWith(...el.childNodes))
    state.book.notes = state.book.notes.filter(n => n.id !== item.id)
    state.lastNoteAction = null
    toast('笔记保存失败，请重试', 3500)
    return
  }
  state.selection = ''
  state.selectionNoteId = ''
  $('#selectionBar').classList.add('hidden')
  renderNotes()
  toast(noteText ? '备注已保存' : '笔记已保存')
}

async function undoLastNoteAction() {
  const action = state.lastNoteAction
  if (!action || action.type !== 'add' || !state.book) {
    toast('没有可撤销的笔记或备注')
    return
  }
  const note = state.book.notes?.find(n => n.id === action.id)
  if (!note) return
  state.book.notes = state.book.notes.filter(n => n.id !== action.id)
  await saveCurrentBook()
  $('#readerFrame').contentDocument?.querySelectorAll(`[data-note="${CSS.escape(action.id)}"]`).forEach(el => el.replaceWith(...el.childNodes))
  state.lastNoteAction = null
  renderNotes()
  hideSelectionTools()

}

function applyNotesToSection(section, chapter) {
