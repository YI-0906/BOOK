// ==================== Reader Core ====================
async function openBook(id) {
  try {
    const book = state.books.find((b) => b.id === id) ||
      (await getBooks()).find((b) => b.id === id)
    if (!book) throw new Error('找不到这本书')
    state.book = normalizeBook(book)
    state.book.lastRead = Date.now()
    
    state.epub = await parseEpub(state.book.data)
    state.fixedViewport = null
    state.renderToken = 0
    state.externalChange = false
    state.chapter = Math.max(0, Math.min(
      state.book.locator?.chapter ?? state.book.chapter ?? 0,
      state.epub.spine.length - 1
    ))
    state.page = state.book.page || 0
    state.continuousStartChapter = state.chapter
    state.continuousLastChapter = state.chapter
    state.continuousLoading = false
    state.searchIndex = null
    state.returnLocator = null
    
    $('#libraryView').classList.add('hidden')
    $('#readerView').classList.remove('hidden')
    $('#bookTitle').textContent = state.book.title
    
    document.documentElement.classList.add('fullscreen-reading')
    applyBookTheme()
    
    renderToc()
    renderNotes()
    
    await renderChapter(state.chapter, '', state.page, { locator: state.book.locator })
  } catch (e) {
    clearUrls()
    state.book = null
    state.epub = null
    document.documentElement.classList.remove('fullscreen-reading')
    $('#readerView').classList.add('hidden')
    $('#libraryView').classList.remove('hidden')
    toast(`图书打开失败：${e.message}`, 4500)
  }
}

async function renderChapter(index, fragment = '', initialPage = 0, options = {}) {
  if (!state.epub || index < 0 || index >= state.epub.spine.length) return
  
  const renderToken = ++state.renderToken
  const restoreScroll = index === state.book.chapter 
    ? (state.book.scrollTop || 0) 
    : (initialPage > 1000 ? Number.MAX_SAFE_INTEGER : 0)
  
  state.chapter = index
  state.page = Math.max(0, initialPage)
  clearUrls()
  
  const path = state.epub.spine[index]
  const text = await state.epub.zip.text(path)
  if (!text) throw new Error('章节文件缺失')
  
  const doc = new DOMParser().parseFromString(text, 'application/xhtml+xml')
  if (doc.querySelector('parsererror') || !doc.body) {
    throw new Error('章节内容损坏或格式不受支持')
  }
  sanitizeEpubDocument(doc)
  
  state.chapterDirection = (
    doc.body.getAttribute('dir') || 
    doc.documentElement.getAttribute('dir') || 
    ''
  ).toLowerCase()
  
  if (state.epub.fixedLayout) {
    const content = doc.querySelector('meta[name="viewport"]')?.getAttribute('content') || ''
    const width = +(content.match(/(?:^|[,;\s])width\s*=\s*([\d.]+)/i)?.[1] || 0)
    const height = +(content.match(/(?:^|[,;\s])height\s*=\s*([\d.]+)/i)?.[1] || 0)
    const viewBox = (doc.querySelector('svg[viewBox]')?.getAttribute('viewBox') || '')
      .trim()
      .split(/[\s,]+/)
      .map(Number)
    
    state.fixedViewport = {
      width: width || (viewBox.length === 4 && viewBox[2]) || 800,
      height: height || (viewBox.length === 4 && viewBox[3]) || 1200
    }
  }
  
  await rewriteDocumentResources(doc, path)

  const chapterMarker = doc.createElement('div')
  chapterMarker.className = 'continuous-chapter'
  chapterMarker.dataset.chapterIndex = String(index)
  chapterMarker.dataset.chapterPath = path
  doc.body.prepend(chapterMarker)
  
  for (const el of [...doc.querySelectorAll('a[href]')]) {
    const href = el.getAttribute('href')
    if (!href || /^(https?:|mailto:)/i.test(href)) {
      el.removeAttribute('href')
      continue
    }
    
    const target = resolvePath(path, href)
    const type = el.getAttribute('epub:type') || 
                 el.getAttributeNS('http://www.idpf.org/2007/ops', 'type') || 
                 el.getAttribute('role') || ''
    
    el.setAttribute('href', '#')
    el.setAttribute('data-epub-href', target)
    el.setAttribute('data-epub-type', type)
  }
  
  const settings = getSettings()
  const injected = doc.createElement('style')
  injected.id = 'reader-runtime-style'
  injected.textContent = buildReaderCss(settings)
  doc.head?.append(injected)
  
  $('#readerFrame').srcdoc = new XMLSerializer().serializeToString(doc)
  
  await new Promise((resolve, reject) => {
    $('#readerFrame').onerror = () => reject(new Error('章节页面加载失败'))
    $('#readerFrame').onload = async () => {
      if (renderToken !== state.renderToken) {
        resolve()
        return
      }
      
      const frame = $('#readerFrame')
      const idoc = frame.contentDocument
      const win = frame.contentWindow
      
      idoc.addEventListener('mouseup', (e) => {
        state.selectionNoteId = ''
        captureSelection(e)
      })
      
      idoc.addEventListener('touchend', (e) => {
        state.selectionNoteId = ''
        captureSelection(e)
      })
      
      idoc.addEventListener('keydown', handleReadingKey)
      
      idoc.addEventListener('click', (e) => {
        const a = e.target.closest('[data-epub-href]')
        if (a) {
          e.preventDefault()
          if (a.dataset.epubType?.includes('noteref') || 
              isFootnoteTarget(a.dataset.epubHref, idoc)) {
            showFootnote(a.dataset.epubHref)
          } else {
            goHref(a.dataset.epubHref)
          }
          return
        }
        
        const img = e.target.closest('img,svg')
        if (img && openImageViewer(img)) {
          e.preventDefault()
          return
        }
        
        if (!win.getSelection().toString() && 
            !e.target.closest('a,button,input,select,textarea')) {
          handleReaderTap(e.clientX, frame.clientWidth)
        }
      })
      
      idoc.addEventListener('touchend', (e) => {
        if (state.epub.fixedLayout) return
        // Reflowable books use the browser's native vertical scroll. Do not turn
        // horizontal gestures into chapter jumps on phones.
        ensureContinuousContent().catch(() => {})
      }, { passive: true })
      
      idoc.addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaY) < 24) return
        
        if (state.epub.fixedLayout) {
          e.preventDefault()
          clearTimeout(state.wheelTimer)
          state.wheelTimer = setTimeout(() => navigateReading(e.deltaY > 0 ? 1 : -1), 80)
          return
        }
        
        if (isScrollMode() && e.deltaY > 0) {
          ensureContinuousContent().catch(() => {})
        }
      }, { passive: false })
      
      for (const media of idoc.querySelectorAll('img,video,audio,object,embed')) {
        media.addEventListener('error', () => media.remove(), { once: true })
        if (media.tagName === 'IMG' && media.complete && media.naturalWidth === 0) {
          media.remove()
        }
      }
      
      applyHighlights(idoc)
      
      try {
        await idoc.fonts?.ready
      } catch {}
      
      await waitForDocumentImages(idoc)
      
      requestAnimationFrame(() => {
        if (renderToken !== state.renderToken) {
          resolve()
          return
        }
        
        const fragmentTarget = fragment ? idoc.getElementById(fragment) : null
        
        if (state.epub.fixedLayout) {
          state.pageCount = 1
          state.page = 0
          win.scrollTo(0, 0)
        } else {
          state.pageCount = 1
          if (fragmentTarget) {
            fragmentTarget.scrollIntoView({ block: 'start' })
          } else if (options.locator && options.locator.chapter === index) {
            scrollToLocator(idoc, options.locator)
          } else {
            win.scrollTo(0, restoreScroll)
          }
          state.book.scrollTop = win.scrollY
          win.addEventListener('scroll', handleReaderScroll, { passive: true })
        }
        
        state.autoChapterReadyAt = Date.now() + 500
        updateReadingProgress()
        saveCurrentBook()
        focusPendingNote()
        state.navigating = false
        
        resolve()
      })
    }
  })
  
  state.book.chapter = index
  state.book.page = state.page
  await saveCurrentBook()
  markToc()
}

function handleReaderScroll() {
  const win = $('#readerFrame').contentWindow
  state.book.scrollTop = win.scrollY
  updateContinuousChapter()
  updateReadingProgress()
  ensureContinuousContent().catch(e => toast(`下一章加载失败：${e.message}`, 3500))

  clearTimeout(handleReaderScroll.timer)
  handleReaderScroll.timer = setTimeout(() => {
    state.book.locator = captureReadingLocator()
    saveCurrentBook()
  }, 250)
}
function currentContinuousChapter(doc = $('#readerFrame').contentDocument) {
  const win = $('#readerFrame').contentWindow
  const markers = [...doc.querySelectorAll('[data-chapter-index]')]
  const y = (win?.scrollY || 0) + Math.max(24, $('#readerFrame').clientHeight * 0.18)
  let current = state.continuousStartChapter ?? state.chapter
  for (const marker of markers) {
    if (marker.offsetTop <= y) current = Number(marker.dataset.chapterIndex) || current
  }
  return Math.max(0, Math.min(state.epub.spine.length - 1, current))
}

async function appendNextChapter() {
  if (!state.epub || state.epub.fixedLayout || state.continuousLoading) return false
  const nextIndex = (state.continuousLastChapter ?? state.chapter) + 1
  if (nextIndex >= state.epub.spine.length) return false

  state.continuousLoading = true
  try {
    const path = state.epub.spine[nextIndex]
    const text = await state.epub.zip.text(path)
    if (!text) throw new Error('章节文件缺失')
    const doc = new DOMParser().parseFromString(text, 'application/xhtml+xml')
    if (doc.querySelector('parsererror') || !doc.body) throw new Error('章节内容损坏')
    sanitizeEpubDocument(doc)
    await rewriteDocumentResources(doc, path)
    for (const el of [...doc.querySelectorAll('a[href]')]) {
      const href = el.getAttribute('href')
      if (!href || /^(https?:|mailto:)/i.test(href)) {
        el.removeAttribute('href')
        continue
      }
      el.setAttribute('href', '#')
      el.setAttribute('data-epub-href', resolvePath(path, href))
      el.setAttribute('data-epub-type', el.getAttribute('epub:type') || el.getAttribute('role') || '')
    }

    const idoc = $('#readerFrame').contentDocument
    for (const sourceStyle of doc.head?.querySelectorAll('style') || []) {
      const style = idoc.createElement('style')
      style.textContent = sourceStyle.textContent
      idoc.head.append(style)
    }
    const section = idoc.createElement('section')
    section.className = 'continuous-chapter'
    section.dataset.chapterIndex = String(nextIndex)
    section.dataset.chapterPath = path
    for (const child of [...doc.body.childNodes]) {
      section.append(idoc.importNode(child, true))
    }
    idoc.body.append(section)
    applyNotesToSection(section, nextIndex)
    state.continuousLastChapter = nextIndex
    return true
  } finally {
    state.continuousLoading = false
  }
}

async function ensureContinuousContent() {
  if (!state.epub || state.epub.fixedLayout) return
  const frame = $('#readerFrame')
  const win = frame.contentWindow
  const doc = frame.contentDocument
  const max = Math.max(0, doc.documentElement.scrollHeight - frame.clientHeight)
  if (win.scrollY >= max - Math.max(180, frame.clientHeight * 0.7)) {
    await appendNextChapter()
  }
}

function continuousChapterRatio() {
  if (!state.epub || state.epub.fixedLayout) return chapterRatio()
  const doc = $('#readerFrame').contentDocument
  const win = $('#readerFrame').contentWindow
  const markers = [...doc.querySelectorAll('[data-chapter-index]')]
  const current = state.chapter
  const marker = markers.find(el => Number(el.dataset.chapterIndex) === current)
  const next = markers.find(el => Number(el.dataset.chapterIndex) === current + 1)
  if (!marker) return chapterRatio()
  const start = marker.offsetTop
  const end = next ? next.offsetTop : doc.documentElement.scrollHeight
  return Math.max(0, Math.min(1, ((win.scrollY || 0) - start) / Math.max(1, end - start - $('#readerFrame').clientHeight)))
}

function updateContinuousChapter() {
  if (!state.epub || state.epub.fixedLayout) return
  state.chapter = currentContinuousChapter()
  state.book.chapter = state.chapter
  state.book.progress = Math.min(1, (state.chapter + continuousChapterRatio()) / state.epub.spine.length)
  state.book.lastRead = Date.now()
  markToc()
}

async function waitForDocumentImages(doc) {
  const images = [...doc.images].filter(img => !img.complete)
  if (!images.length) return
  
  await Promise.race([
    Promise.all(images.map(img => new Promise(resolve => {
      img.addEventListener('load', resolve, { once: true })
      img.addEventListener('error', resolve, { once: true })
    }))),
    new Promise(resolve => setTimeout(resolve, 1800))
  ])
}

function chapterRatio() {
  const frame = $('#readerFrame')
  if (state.epub?.fixedLayout) {
    return state.chapter === state.epub.spine.length - 1 ? 1 : 0
  }
  
  const doc = frame.contentDocument
  const max = Math.max(1, doc?.documentElement.scrollHeight - frame.clientHeight)
  return Math.min(1, (frame.contentWindow?.scrollY || 0) / max)
}

function updateReadingProgress() {
  if (!state.book || !state.epub) return
  
  const ratio = state.epub.fixedLayout ? chapterRatio() : continuousChapterRatio()
  const total = state.epub.spine.length
  state.book.progress = Math.min(1, (state.chapter + ratio) / total)
  
  if (state.epub.fixedLayout && state.chapter === total - 1) {
    state.book.progress = 1
  }
  
  state.book.chapter = state.chapter
  state.book.page = state.page
  
  if (!state.book.locator || 
      !state.book.locatorAt || 
      Date.now() - state.book.locatorAt > 260) {
    state.book.locator = captureReadingLocator()
    state.book.locatorAt = Date.now()
  }
  
  state.book.lastRead = Date.now()
  
}

function showReadingStatus(ms = 1250) {
  if (!state.book || !state.epub) return
  
  $('#readingStatusChapter').textContent = chapterLabel(state.chapter)
  $('#readingStatusPage').textContent = '滚动阅读'
  $('#readingStatusProgress').textContent = `全书 ${Math.round((state.book.progress || 0) * 100)}%`
  
  const box = $('#readingStatus')
  box.classList.add('visible')
  
  clearTimeout(state.statusTimer)
  state.statusTimer = setTimeout(() => box.classList.remove('visible'), ms)
}

async function navigateReading(delta) {
  if (state.navigating || !state.book || !state.epub) return
  
  const frame = $('#readerFrame')
  const win = frame.contentWindow
  
  if (state.epub?.fixedLayout) {
    // Fixed layout: go to next/prev chapter
  } else {
    return ensureContinuousContent()
      .then(() => {
        const doc = frame.contentDocument
        const step = frame.clientHeight * 0.82
        const max = doc.documentElement.scrollHeight - frame.clientHeight
        const target = win.scrollY + delta * step
        if (target >= 0 && target <= max + 5) {
          win.scrollTo({ top: Math.max(0, target), behavior: 'smooth' })
          return true
        }
        return false
      })
  }
  
  const chapter = state.chapter + delta
  if (chapter >= 0 && chapter < state.epub.spine.length) {
    state.navigating = true
    try {
      await renderChapter(chapter, '', delta < 0 ? 99999 : 0)
      showReadingStatus(1500)
    } catch (e) {
      state.navigating = false
      toast(`章节打开失败：${e.message}`)
    }
  }
}

function isScrollMode() {
  return !!state.epub && !state.epub.fixedLayout && getSettings().mode === 'scroll'
}

function saveReadingPosition() {
  if (!state.book || !state.epub) return
  state.book.locator = captureReadingLocator()
  state.book.lastRead = Date.now()
  return saveCurrentBook()
}
// ==================== Locator System ====================
function textMap(root) {
  const doc = root.ownerDocument
  const walker = doc.createTreeWalker(root, doc.defaultView.NodeFilter.SHOW_TEXT)
  let node
  let total = 0
  const nodes = []
  
  while (node = walker.nextNode()) {
    nodes.push({ node, start: total, end: total + node.data.length })
    total += node.data.length
  }
  
  return { nodes, total }
}

function captureReadingLocator() {
  const frame = $('#readerFrame')
  const doc = frame.contentDocument
  
  if (!doc?.body) {
    return state.book?.locator || { chapter: state.chapter, offset: 0, ratio: chapterRatio() }
  }
  
  const map = textMap(doc.body)
  const viewportX = Math.max(12, frame.clientWidth * 0.08)
  const viewportY = Math.max(12, frame.clientHeight * 0.08)
  let best = null
  
  for (const item of map.nodes) {
    if (!item.node.data.trim()) continue
    
    const range = doc.createRange()
    range.selectNodeContents(item.node)
    const rect = [...range.getClientRects()].find(r => 
      r.bottom > viewportY && r.top < frame.clientHeight - viewportY
    )
    
    if (rect) {
      best = item
      break
    }
  }
  
  const offset = best?.start ?? Math.round(map.total * chapterRatio())
  const text = doc.body.textContent || ''
  
  return {
    chapter: state.chapter,
    offset,
    ratio: chapterRatio(),
    before: text.slice(Math.max(0, offset - 32), offset),
    after: text.slice(offset, offset + 64),
    scrollTop: frame.contentWindow?.scrollY || 0
  }
}

function resolveLocatorOffset(doc, locator) {
  const text = doc.body?.textContent || ''
  
  if (locator?.after) {
    const candidates = []
    let from = 0
    
    while ((from = text.indexOf(locator.after, from)) >= 0) {
      candidates.push(from)
      from += Math.max(1, locator.after.length)
    }
    
    if (candidates.length) {
      const expected = Number.isFinite(locator.offset) 
        ? locator.offset 
        : Math.round((locator.ratio || 0) * text.length)
      return candidates.sort((a, b) => Math.abs(a - expected) - Math.abs(b - expected))[0]
    }
    
    if (locator.before) {
      const b = text.lastIndexOf(
        locator.before, 
        Math.max(0, (locator.offset || 0) + locator.before.length + 256)
      )
      if (b >= 0) return b + locator.before.length
    }
  }
  
  return Math.max(0, Math.min(text.length, locator?.offset || 0))
}

function nodeAtTextOffset(doc, offset) {
  const map = textMap(doc.body)
  return map.nodes.find(x => x.end >= offset) || map.nodes.at(-1)
}

function scrollToLocator(doc, locator) {
  const item = nodeAtTextOffset(doc, resolveLocatorOffset(doc, locator))
  if (item?.node.parentElement) {
    item.node.parentElement.scrollIntoView({ block: 'start' })
  } else {
    doc.defaultView.scrollTo(0, locator?.scrollTop || 0)
  }
}

// ==================== Navigation ====================
function renderToc() {
  $('#tocPanel').innerHTML = ''
  
  state.epub.toc.forEach((item) => {
    const b = document.createElement('button')
    b.className = 'toc-item'
    b.textContent = item.label
    b.dataset.href = item.href
    b.onclick = () => goHref(item.href)
    $('#tocPanel').append(b)
  })
  
  markToc()
}

function markToc() {
  $$('.toc-item').forEach((b) => {
    b.classList.toggle(
      'active',
      b.dataset.href.split('#')[0] === state.epub.spine[state.chapter]
    )
  })
}

function goHref(href) {
  const [path, frag] = href.split('#')
  let i = state.epub.spine.indexOf(path)
  
  if (i < 0) {
    i = state.epub.spine.findIndex((p) => p.endsWith(path))
  }
  
  if (i >= 0) {
    renderChapter(i, frag)
  }
}

function isFootnoteTarget(href, doc) {
  const [path, frag] = href.split('#')
  if (!frag || path !== state.epub.spine[state.chapter]) return false
  
  let el = doc.getElementById(frag)
  while (el) {
    const type = el.getAttribute?.('epub:type') || 
                 el.getAttributeNS?.('http://www.idpf.org/2007/ops', 'type') || ''
    
    if (type.split(/\s+/).includes('footnote') || 
        el.getAttribute?.('role') === 'doc-footnote' || 
        el.tagName?.toLowerCase() === 'aside') {
      return true
    }
    
    el = el.parentElement
  }
  
  return false
}

async function showFootnote(href) {
  const [path, frag] = href.split('#')
  let doc
  
  if (path === state.epub.spine[state.chapter]) {
    doc = $('#readerFrame').contentDocument
  } else {
    const raw = await state.epub.zip.text(path)
    doc = new DOMParser().parseFromString(raw, 'application/xhtml+xml')
    if (doc.body) await rewriteDocumentResources(doc, path)
  }
  
  const target = frag && doc?.getElementById(frag)
  if (!target) {
    goHref(href)
    return
  }
  
  const clone = target.cloneNode(true)
  clone.querySelectorAll('script,style,link,iframe,form,input,button,object,embed,audio,video')
    .forEach(el => el.remove())
  
  for (const el of [clone, ...clone.querySelectorAll('*')]) {
    for (const attr of [...el.attributes]) {
      if (/^on/i.test(attr.name) || attr.name === 'srcdoc') {
        el.removeAttribute(attr.name)
      }
    }
  }
  
  clone.querySelectorAll('a').forEach(a => a.replaceWith(...a.childNodes))
  
  const box = $('#footnoteContent')
  box.replaceChildren(...clone.childNodes)
  $('#footnoteDialog').showModal()
}

function chapterLabel(index) {
  const path = state.epub?.spine[index]
  const exact = state.epub?.toc.find(x => x.href.split('#')[0] === path)
  return exact?.label || `第 ${index + 1} 章`
}

// ==================== Reader UI Controls ====================
function closeReaderDrawer() {
  const side = $('#sidebar')
  side.classList.remove('open')
  side.dataset.panel = ''
  $('#drawerBackdrop').classList.remove('visible')
}

function handleReaderTap(x, width) {
  const side = $('#sidebar')
  if (side.classList.contains('open')) {
    closeReaderDrawer()
    return
  }
  
  const ratio = x / Math.max(1, width)
  if (ratio < 0.28) {
    navigateReading(state.epub?.direction === 'rtl' ? 1 : -1)
    return
  }
  if (ratio > 0.72) {
    navigateReading(state.epub?.direction === 'rtl' ? -1 : 1)
    return
  }
}

function openImageViewer(media) {
  const rect = media.getBoundingClientRect()
  if (Math.max(rect.width, rect.height) < 48) return false
  
  const tag = (media.localName || media.tagName || '').toLowerCase()
  let src = ''
  
  if (tag === 'img') {
    src = media.currentSrc || media.src
  } else if (tag === 'svg') {
    try {
      src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(
        new XMLSerializer().serializeToString(media)
      )}`
    } catch {}
  }
  
  if (!src) return false
  
  $('#imageViewerImg').src = src
  $('#imageViewer').classList.remove('hidden')
  return true
}

function closeImageViewer() {
  $('#imageViewer').classList.add('hidden')
  $('#imageViewerImg').removeAttribute('src')
}

async function home() {
  if (state.book) await saveReadingPosition()
  
  clearUrls()
  closeImageViewer()
  closeReaderDrawer()
  
  state.book = null
  state.epub = null
  state.fixedViewport = null
  state.returnLocator = null
  
  document.documentElement.classList.remove('fullscreen-reading')
  document.documentElement.dataset.theme = normalizeSettings(legacySettings()).theme
  
  $('#readerView').classList.add('hidden')
  $('#libraryView').classList.remove('hidden')
  $('#bookTitle').textContent = '我的书架'
  
  loadLibrary()
}

function openSidebar(panel) {
  const side = $('#sidebar')
  const same = side.classList.contains('open') && side.dataset.panel === panel
  
  if (same) {
    closeReaderDrawer()
    return
  }
  
  side.classList.add('open')
  side.dataset.panel = panel
  $('#drawerBackdrop').classList.add('visible')
  
  $$('.tab').forEach(x => x.classList.toggle('active', x.dataset.panel === panel))
  $$('.side-panel').forEach(x => x.classList.toggle('hidden', x.id !== panel))
  
  $('#drawerTitle').textContent = 
    panel === 'tocPanel' ? '目录' :
    panel === 'notesPanel' ? '标注' : '设置'
  
  if (panel === 'settingsPanel') syncSettings()
}

function handleReadingKey(e) {
  if ((e.ctrlKey || e.metaKey) && !e.altKey) {
    const key = e.key.toLowerCase()
    const target = e.target
    const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(target?.tagName) || target?.isContentEditable

    if (key === 'f' && state.book && !isTyping) {
      e.preventDefault()
      $('#searchDialog').showModal()
      $('#searchInput').focus()
      return
    }

    if (key === 'e' && state.book && !isTyping) {
      e.preventDefault()
      $('#exportDialog').showModal()
      return
    }

    if (key === 's' && state.book && !isTyping) {
      e.preventDefault()
      saveReadingPosition().then(() => toast('阅读位置已保存')).catch(() => toast('保存失败，请重试', 3500))
      return
    }
  }

  if (e.key === 'Escape') {
    const dialog = $('dialog[open]')
    if (dialog) {
      e.preventDefault()
      dialog.close()
      return
    }
    
    if (!$('#imageViewer').classList.contains('hidden')) {
      e.preventDefault()
      closeImageViewer()
      return
    }
    
    if (state.selection || !$('#selectionBar').classList.contains('hidden')) {
      e.preventDefault()
      hideSelectionTools()
      return
    }
    
    if ($('#sidebar').classList.contains('open')) {
      e.preventDefault()
      closeReaderDrawer()
      return
    }
  }
  
  if (!state.book || 
      $('dialog[open]') || 
      e.defaultPrevented || 
      e.metaKey || 
      e.ctrlKey || 
      e.altKey) return
  
  const target = e.target
  const tag = target?.tagName
  
  if (['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(tag) || 
      target?.isContentEditable) return
  
  if (e.key === 'ArrowLeft' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) {
    e.preventDefault()
    navigateReading(state.epub?.direction === 'rtl' ? 1 : -1)
  } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
    e.preventDefault()
    navigateReading(state.epub?.direction === 'rtl' ? -1 : 1)
  }
}
// ==================== Notes & Highlights ====================
function captureSelection() {
  clearTimeout(state.selectionTimer)
  state.selectionTimer = setTimeout(() => {
    const frame = $('#readerFrame')
    const sel = frame.contentWindow.getSelection()
    const text = sel?.toString().trim()
    const bar = $('#selectionBar')
    
    state.selection = text || ''
    bar.classList.toggle('hidden', !text)
    
    if (!text || !sel.rangeCount) return
    
    const rect = sel.getRangeAt(0).getBoundingClientRect()
    const frameRect = frame.getBoundingClientRect()
    const stageRect = $('.reading-stage').getBoundingClientRect()
    
    const barWidth = bar.offsetWidth || 260
    const barHeight = bar.offsetHeight || 42
    const selectionTop = frameRect.top - stageRect.top + rect.top
    const selectionBottom = frameRect.top - stageRect.top + rect.bottom
    const spaceBelow = stageRect.height - selectionBottom
    const spaceAbove = selectionTop
    const preferBelow = spaceBelow >= barHeight + 16
    const useBelow = preferBelow || spaceBelow >= spaceAbove
    const half = barWidth / 2 + 10
    const left = Math.max(
      half,
      Math.min(
        stageRect.width - half,
        frameRect.left - stageRect.left + rect.left + rect.width / 2
      )
    )
    const rawTop = useBelow
      ? selectionBottom + 12
      : selectionTop - barHeight - 12
    const top = Math.max(10, Math.min(stageRect.height - barHeight - 10, rawTop))
    
    bar.dataset.placement = useBelow ? 'below' : 'above'
    bar.style.left = `${left}px`
    bar.style.top = `${top}px`
    
    syncSelectionActions()
  }, 280)
}

function selectedTextPosition() {
  const sel = $('#readerFrame').contentWindow?.getSelection()
  return sel?.rangeCount 
    ? textOffset(
        $('#readerFrame').contentDocument.body,
        sel.getRangeAt(0).startContainer,
        sel.getRangeAt(0).startOffset
      )
    : -1
}

function textOffset(root, node, offset) {
  const doc = root.ownerDocument
  const range = doc.createRange()
  
  try {
    range.selectNodeContents(root)
    range.setEnd(node, offset)
    return range.toString().length
  } catch {
    return -1
  }
}

function matchingNotes(kind, quote = state.selection) {
  const notes = state.book.notes || []
  const focused = state.selectionNoteId && 
    notes.find(n => n.id === state.selectionNoteId && (n.kind || 'marker') === kind)
  
  if (focused) return [focused]
  
  const position = selectedTextPosition()
  return notes.filter(n => 
    n.chapter === state.chapter &&
    (n.kind || 'marker') === kind &&
    n.quote === quote &&
    (position < 0 || n.position < 0 || Math.abs(n.position - position) <= 1)
  )
}

function matchingNote(kind, quote = state.selection) {
  return matchingNotes(kind, quote)[0]
}

function syncSelectionActions() {
  $('#noteBtn').classList.toggle('active', !!matchingNote('marker'))
}

async function addNote(kind) {
  if (!state.selection) return
  
  const existing = matchingNotes(kind)
  if (existing.length) {
    const ids = new Set(existing.map(n => n.id))
    state.book.notes = state.book.notes.filter(n => !ids.has(n.id))
    await saveCurrentBook()
    for (const id of ids) {
      const marked = $('#readerFrame').contentDocument.querySelectorAll(`[data-note="${CSS.escape(id)}"]`)
      for (const el of marked) el.replaceWith(...el.childNodes)
    }
    $('#readerFrame').contentWindow.getSelection()?.removeAllRanges()
    state.selection = ''
    state.selectionNoteId = ''
    $('#selectionBar').classList.add('hidden')
    renderNotes()
    toast('已删除笔记')
    return
  }
  
  const thought = kind === 'marker' ? prompt('添加备注（可选）：', '') : ''
  if (kind === 'marker' && thought === null) return
  
  const position = selectedTextPosition()
  const bodyText = $('#readerFrame').contentDocument.body.textContent || ''
  
  const item = {
    id: uid(),
    chapter: state.chapter,
    quote: state.selection,
    note: thought,
    kind,
    position,
    before: bodyText.slice(Math.max(0, position - 32), position),
    after: bodyText.slice(
      position + state.selection.length,
      position + state.selection.length + 32
    ),
    color: getSettings().highlightColor || 'yellow',
    created: Date.now(),
    updated: Date.now()
  }
  
  state.book.notes ||= []
  state.book.notes.push(item)
  await saveCurrentBook()
  
  const idoc = $('#readerFrame').contentDocument
  highlightFirst(idoc.body, item.quote, item.id, item.kind, item.position, item)
  $('#readerFrame').contentWindow.getSelection()?.removeAllRanges()
  
  state.selection = ''
  state.selectionNoteId = ''
  $('#selectionBar').classList.add('hidden')
  renderNotes()
  
  toast('笔记已保存')
}

function applyNotesToSection(section, chapter) {

  }
}
function applyHighlights(doc) {
  applyNotesToSection(doc.body, state.chapter)
}

function locateNoteText(all, note) {
  if (note.position >= 0 && 
      all.slice(note.position, note.position + note.quote.length) === note.quote) {
    return note.position
  }
  
  if (note.before || note.after) {
    let from = 0
    while ((from = all.indexOf(note.quote, from)) >= 0) {
      const before = all.slice(
        Math.max(0, from - (note.before || '').length),
        from
      )
      const after = all.slice(
        from + note.quote.length,
        from + note.quote.length + (note.after || '').length
      )
      
      if ((!note.before || before.endsWith(note.before)) &&
          (!note.after || after.startsWith(note.after))) {
        return from
      }
      
      from += note.quote.length
    }
  }
  
  return all.indexOf(note.quote)
}

function highlightFirst(root, quote, id, kind = 'marker', position = -1, note = {}) {
  const doc = root.ownerDocument
  const walker = doc.createTreeWalker(root, doc.defaultView.NodeFilter.SHOW_TEXT)
  let node
  let all = ''
  const nodes = []
  
  while (node = walker.nextNode()) {
    nodes.push({ node, start: all.length, end: all.length + node.data.length })
    all += node.data
  }
  
  const at = locateNoteText(all, { ...note, quote, position })
  if (at < 0) return
  
  const end = at + quote.length
  const relevant = nodes.filter(x => x.end > at && x.start < end)
  
  for (const part of relevant.reverse()) {
    const from = Math.max(0, at - part.start)
    const to = Math.min(part.node.data.length, end - part.start)
    if (from >= to) continue
    
    try {
      const range = doc.createRange()
      const mark = doc.createElement('span')
      range.setStart(part.node, from)
      range.setEnd(part.node, to)
      
      mark.className = kind === 'underline' ? 'reader-underline' : 'reader-highlight'
      mark.dataset.note = id
      
      if (kind !== 'underline') {
        mark.dataset.color = note.color || 'yellow'
      }
      
      range.surroundContents(mark)
    } catch {}
  }
}

function focusPendingNote() {
  if (!state.pendingNoteId) return
  
  const id = state.pendingNoteId
  state.pendingNoteId = ''
  
  requestAnimationFrame(() => {
    const doc = $('#readerFrame').contentDocument
    const marks = [...doc.querySelectorAll(`[data-note="${CSS.escape(id)}"]`)]
    const el = marks[0]
    
    if (!el) return
    
    const frame = $('#readerFrame')
    const note = state.book.notes.find(n => n.id === id)
    
    if (!state.epub.fixedLayout) {
      el.scrollIntoView({ block: 'center' })
    }
    
    const range = doc.createRange()
    range.setStart(el, 0)
    range.setEnd(marks.at(-1), marks.at(-1).childNodes.length)
    
    const sel = frame.contentWindow.getSelection()
    sel.removeAllRanges()
    sel.addRange(range)
    
    state.selectionNoteId = id
    updateReadingProgress()
    captureSelection()
  })
}

    if (edit) {
      edit.onclick = async () => {
        if ((n.kind || 'marker') === 'marker') {

          n.color = colors[(colors.indexOf(n.color || 'yellow') + 1) % colors.length]
          n.updated = Date.now()
          await saveCurrentBook()
          
          if (n.chapter === state.chapter) {
            renderChapter(state.chapter, '', state.page, { locator: captureReadingLocator() })
          }
        } else {
          const value = prompt('编辑想法：', n.note || '')
          if (value === null) return
          n.note = value

          await saveCurrentBook()
        }

      renderNotes()
      
      if (n.chapter === state.chapter) {
        renderChapter(state.chapter, '', state.page, { locator: captureReadingLocator() })
      }

    p.append(d)
  }

// ==================== Export Notes ====================
function exportCurrentNotes(format = 'txt') {
  if (!state.book) return
  
  const notes = [...(state.book.notes || [])].sort(
    (a, b) => (a.chapter - b.chapter) || (a.created - b.created)
  )
  
  if (!notes.length) {
    toast('当前书籍还没有笔记')
    return
  }
  
  if (format === 'json') {
    downloadText(
      `${safeFileName(state.book.title)}-阅读笔记.json`,
      JSON.stringify({
        version: 2,
        book: { title: state.book.title, author: state.book.author },
        notes
      }, null, 2),
      'application/json'
    )
    toast(`已导出 ${notes.length} 条笔记`)
    return
  }
  
  if (format === 'md') {
    const lines = [
      `# 《${state.book.title}》阅读笔记`,
      ``,
      `作者：${state.book.author || '未知作者'}`,
      ``
    ]
    
    let last = -1
    for (const n of notes) {
      if (n.chapter !== last) {
        lines.push(`## ${chapterLabel(n.chapter)}`, ``)
        last = n.chapter
      }
      
      lines.push(
        `> ${n.quote.replace(/\n/g, '\n> ')}`,
        ``,
        `- 类型：${noteKindLabel(n.kind)}`,
        n.note ? `- 想法：${n.note}` : '',
        `- 时间：${new Date(n.created).toLocaleString('zh-CN')}`,
        ``
      )
    }
    
    downloadText(
      `${safeFileName(state.book.title)}-阅读笔记.md`,
      lines.filter(x => x !== undefined).join('\n'),
      'text/markdown;charset=utf-8'
    )
    toast(`已导出 ${notes.length} 条笔记`)
    return
  }
  
  const parts = [
    `《${state.book.title}》`,
    `作者：${state.book.author || '未知作者'}`,
    `导出时间：${new Date().toLocaleString('zh-CN')}`,
    ''
  ]
  
  let last = -1
  for (const note of notes) {
    if (note.chapter !== last) {
      if (last >= 0) parts.push('')
      parts.push(chapterLabel(note.chapter), '--------------------------------')
      last = note.chapter
    }
    
    parts.push(
      `类型：${noteKindLabel(note.kind)}`,
      `摘录："${note.quote}"`
    )
    
    if (note.note) parts.push(`想法：${note.note}`)
    parts.push(`时间：${new Date(note.created).toLocaleString('zh-CN')}`, '')
  }
  
  downloadText(
    `${safeFileName(state.book.title)}-阅读笔记.txt`,
    '\ufeff' + parts.join('\n')
  )
  toast(`已导出 ${notes.length} 条笔记`)
}
// ==================== Search ====================
async function searchBook() {
  const q = $('#searchInput').value.trim().toLocaleLowerCase()
  const out = $('#searchResults')
  
  out.innerHTML = ''
  if (!q) return
  
  out.innerHTML = '<p class="card-meta">正在建立本地搜索索引…</p>'
  
  if (!state.searchIndex) {
    state.searchIndex = []
    for (let i = 0; i < state.epub.spine.length; i++) {
      const raw = await state.epub.zip.text(state.epub.spine[i])
      const doc = new DOMParser().parseFromString(raw, 'application/xhtml+xml')
      const text = doc.body?.textContent || ''
      state.searchIndex.push({ i, text, lower: text.toLocaleLowerCase() })
    }
  }
  
  const found = []
  for (const chapter of state.searchIndex) {
    let from = 0
    let count = 0
    
    while ((from = chapter.lower.indexOf(q, from)) >= 0 && count < 20) {
      found.push({
        i: chapter.i,
        position: from,
        text: chapter.text.slice(Math.max(0, from - 55), from + q.length + 90)
      })
      from += q.length
      count++
    }
  }
  
  out.innerHTML = ''
  
  for (const r of found.slice(0, 200)) {
    const d = document.createElement('div')
    d.className = 'search-result'
    
    const preview = r.text.replace(/\s+/g, ' ').trim()
    const marked = escapeHtml(preview).replace(
      new RegExp(escapeRegExp(q), 'ig'),
      m => `<mark>${m}</mark>`
    )
    
    d.innerHTML = `
      <b>${escapeHtml(chapterLabel(r.i))}</b>
      <p>${marked}</p>
    `
    
    d.onclick = () => {
      const raw = state.searchIndex[r.i].text
      state.book.locator = {
        chapter: r.i,
        offset: r.position,
        ratio: raw.length ? r.position / raw.length : 0,
        before: raw.slice(Math.max(0, r.position - 32), r.position),
        after: raw.slice(r.position, r.position + 64)
      }
      renderChapter(r.i, '', 0, { locator: state.book.locator })
      $('#searchDialog').close()
    }
    
    out.append(d)
  }
  
  if (!found.length) {
    out.innerHTML = '<p class="card-meta">没有找到匹配内容。</p>'
  }
}

// ==================== Settings Management ====================
function legacySettings() {
  try {
    return {
      size: +safeLocalGet('readerSize', '') || 18,
      line: +safeLocalGet('readerLine', '') || 1.8,
      paragraph: +safeLocalGet('readerParagraph', '') || 1,
      width: +safeLocalGet('readerWidth', '') || 800,
      font: safeLocalGet('readerFont', '') || DEFAULT_SETTINGS.font,
      mode: safeLocalGet('readerMode', '') || 'scroll',
      typography: safeLocalGet('readerTypography', '') || 'book',
      theme: safeLocalGet('readerTheme', '') || 'light'
    }
  } catch {
    return { ...DEFAULT_SETTINGS }
  }
}

function clampSetting(value, min, max, fallback) {
  const number = +value
  return Number.isFinite(number) ? Math.max(min, Math.min(max, number)) : fallback
}

function normalizeSettings(raw = {}) {
  const fontOptions = [
    "system-ui, sans-serif",
    "Georgia, 'Songti SC', serif",
    "'Kaiti SC', 'STKaiti', serif"
  ]
  
  const pick = (value, options, fallback) => 
    options.includes(value) ? value : fallback
  
  return {
    size: clampSetting(raw.size, 14, 30, DEFAULT_SETTINGS.size),
    line: clampSetting(raw.line, 1.3, 2.4, DEFAULT_SETTINGS.line),
    paragraph: clampSetting(raw.paragraph, 0.4, 2, DEFAULT_SETTINGS.paragraph),
    width: clampSetting(raw.width, 560, 1080, DEFAULT_SETTINGS.width),
    font: pick(raw.font, fontOptions, DEFAULT_SETTINGS.font),
    mode: pick(raw.mode, ['scroll'], DEFAULT_SETTINGS.mode),
    typography: pick(raw.typography, ['book', 'custom'], DEFAULT_SETTINGS.typography),
    theme: pick(raw.theme, ['light', 'eink', 'dark'], DEFAULT_SETTINGS.theme),
    align: pick(raw.align, ['book', 'justify', 'left'], DEFAULT_SETTINGS.align),
    indent: pick(+raw.indent, [0, 1, 2], DEFAULT_SETTINGS.indent),
    weight: pick(+raw.weight, [300, 400, 500, 600], DEFAULT_SETTINGS.weight),
    imageWidth: clampSetting(raw.imageWidth, 40, 100, DEFAULT_SETTINGS.imageWidth),
    pageMargin: clampSetting(raw.pageMargin, 3, 12, DEFAULT_SETTINGS.pageMargin),
    highlightColor: pick(
      raw.highlightColor,
      ['yellow', 'green', 'blue', 'pink'],
      DEFAULT_SETTINGS.highlightColor
    )
  }
}

function getSettings() {
  return normalizeSettings({
    ...DEFAULT_SETTINGS,
    ...legacySettings(),
    ...(state.book?.settings || {})
  })
}

async function persistBookSettings(patch) {
  if (!state.book) return
  
  state.book.settings = normalizeSettings({ ...getSettings(), ...patch })
  state.book.settingsUpdatedAt = Date.now()
  await saveCurrentBook()
}

function setSettings(changedId = '') {
  const locator = state.book ? captureReadingLocator() : null
  const current = getSettings()
  
  const patch = {
    size: +$('#fontSize').value,
    line: +$('#lineHeight').value,
    paragraph: +$('#paragraphSpacing').value,
    width: +$('#pageWidth').value,
    font: $('#fontFamily').value,
    align: $('#textAlign').value,
    indent: +$('#textIndent').value,
    weight: +$('#fontWeight').value,
    imageWidth: +$('#imageWidth').value,
    pageMargin: +$('#pageMargin').value
  }
  
  const typographyChanged = 
    patch.font !== current.font ||
    patch.size !== current.size ||
    patch.line !== current.line ||
    patch.paragraph !== current.paragraph ||
    patch.align !== current.align ||
    patch.indent !== current.indent ||
    patch.weight !== current.weight
  
  if (typographyChanged || [
    'fontFamily', 'fontSize', 'lineHeight', 'paragraphSpacing',
    'textAlign', 'textIndent', 'fontWeight'
  ].includes(changedId)) {
    patch.typography = 'custom'
  }
  
  persistBookSettings(patch)
  syncTypographyUI()
  applyReaderAppearance({ locator })
}

function syncTypographyUI() {
  const locked = !!state.epub?.fixedLayout
  const book = locked || getSettings().typography !== 'custom'
  
  $('#bookTypography').classList.toggle('active', book)
  $('#customTypography').classList.toggle('active', !book)
  $('#bookTypography').disabled = locked
  $('#customTypography').disabled = locked
  
  for (const id of [
    'fontFamily', 'fontSize', 'lineHeight', 'paragraphSpacing',
    'textAlign', 'textIndent', 'fontWeight'
  ]) {
    $('#' + id).disabled = book || locked
  }
  
  for (const id of ['pageWidth', 'pageMargin', 'imageWidth']) {
    $('#' + id).disabled = !!state.epub?.fixedLayout
  }
}

function setTypography(mode) {
  if (state.epub?.fixedLayout || 
      mode === getSettings().typography || 
      !['book', 'custom'].includes(mode)) return
  
  const locator = captureReadingLocator()
  persistBookSettings({ typography: mode })
  syncTypographyUI()
  applyReaderAppearance({ locator })
}

function syncSettings() {
  const s = getSettings()
  
  $('#fontSize').value = s.size
  $('#lineHeight').value = s.line
  $('#paragraphSpacing').value = s.paragraph
  $('#pageWidth').value = s.width

  $('#textAlign').value = s.align

function setHighlightColor(color) {
  if (!state.book || !['yellow', 'green', 'blue', 'pink'].includes(color)) return
  
  persistBookSettings({ highlightColor: color })
  
  $$('[data-highlight-color]').forEach(b => 
    b.classList.toggle('active', b.dataset.highlightColor === color)
  )
  
  const note = matchingNote('marker')

    $('#readerFrame').contentDocument?.querySelectorAll(
      `[data-note="${CSS.escape(note.id)}"]`
    ).forEach(el => el.dataset.color = color)
    
    renderNotes()
  }
  
  toast(note ? '已更新当前马克笔颜色' : '已设为默认马克笔颜色')
}

// ==================== Theme Management ====================
function applyBookTheme() {
  document.documentElement.dataset.theme = getSettings().theme
}

function setTheme(theme) {
  if (!['light', 'eink', 'dark'].includes(theme)) return
  
  const locator = state.book ? captureReadingLocator() : null
  document.documentElement.dataset.theme = theme
  
  if (state.book) {
    persistBookSettings({ theme })
  } else {
    safeLocalSet('readerTheme', theme)
  }
  
  syncThemeUI()
  if (state.book) applyReaderAppearance({ locator })
}

function syncThemeUI() {
  $$('[data-theme-value]').forEach(b => 
    b.classList.toggle(
      'active',
      b.dataset.themeValue === (
        getSettings().theme || 
        document.documentElement.dataset.theme || 
        'light'
      )
    )
  )
}

function cycleTheme() {
  const themes = ['light', 'eink', 'dark']
  const current = themes.includes(document.documentElement.dataset.theme) 
    ? document.documentElement.dataset.theme 
    : 'light'
  const next = themes[(themes.indexOf(current) + 1) % themes.length]
  setTheme(next)
}

// ==================== Reader CSS Builder ====================
function themeInk() {
  return getComputedStyle(document.documentElement).getPropertyValue('--ink')
}

function buildReaderCss(settings = getSettings()) {
  const frame = $('#readerFrame')
  const frameWidth = Math.max(320, frame?.clientWidth || 1024)
  const frameHeight = Math.max(320, frame?.clientHeight || 768)
  
  const marginScale = Math.max(0.5, Math.min(1.6, (+settings.pageMargin || 6) / 6))
  const outer = Math.max(20, Math.min(140, frameWidth * 0.045 * marginScale))
  
  const paper = getComputedStyle(document.documentElement)
    .getPropertyValue('--paper')
    .trim() || '#fff'
  
  const fixed = !!state.epub?.fixedLayout
  
  const fixedViewport = state.fixedViewport || { width: 800, height: 1200 }
  const fixedScale = Math.min(
    frameWidth / fixedViewport.width,
    frameHeight / fixedViewport.height
  )
  
  const readingLayout = fixed
    ? `html{height:100%;overflow:hidden!important}body{position:absolute!important;left:50%!important;top:50%!important;width:${fixedViewport.width}px!important;height:${fixedViewport.height}px!important;min-width:${fixedViewport.width}px!important;min-height:${fixedViewport.height}px!important;margin:0!important;overflow:hidden!important;transform:translate(-50%,-50%) scale(${fixedScale})!important;transform-origin:center!important;}`
    : `html{height:100%;overflow:auto!important;scrollbar-width:auto!important}body{width:min(${settings.width}px,calc(100vw - ${outer * 2}px))!important;max-width:none!important;margin:0 auto!important;padding:52px ${Math.max(24, Math.round(outer * 0.45))}px 110px!important;transform:none!important;zoom:1!important;}`
  
  const align = settings.align === 'justify' 
    ? 'text-align:justify!important;' 
    : settings.align === 'left' 
    ? 'text-align:left!important;' 
    : ''
  
  const indent = +settings.indent > 0 
    ? `text-indent:${+settings.indent}em!important;` 
    : ''
  
  const typography = !fixed && settings.typography === 'custom'
    ? `body,body p,body div,body li,body blockquote,body dd,body dt,body td,body th,body section,body article{font-family:${settings.font}!important;font-size:${settings.size}px!important;font-weight:${+settings.weight || 400}!important;font-stretch:normal!important;font-kerning:normal;text-rendering:optimizeLegibility;line-height:${settings.line}!important}body p span:not(sup):not(sub):not(rt){font-family:inherit!important;font-size:inherit!important;font-stretch:normal!important;line-height:inherit!important}body p{margin-top:${settings.paragraph}em!important;margin-bottom:${settings.paragraph}em!important;${align}${indent}}`
    : ''
  
  const media = fixed 
    ? '' 
    : `img,svg,video,object{max-width:${Math.max(40, Math.min(100, +settings.imageWidth || 100))}%!important;height:auto!important;break-inside:avoid}`
  
  const themeOverride = !fixed && (settings.theme === 'dark' || settings.theme === 'eink')
    ? `body,body *:not(#reader-theme-sentinel):not(.reader-highlight){color:${themeInk()}!important}`
    : ''
  
  return `*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}html{background:transparent!important;scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}body{${fixed ? '' : `color:${themeInk()};`}background:transparent!important;box-sizing:border-box}${typography}${media}${themeOverride}img:not([src]),source:not([srcset]){display:none!important}table,pre{max-width:100%!important;overflow-wrap:anywhere;word-break:break-word}td,th{overflow-wrap:anywhere;word-break:break-word}ruby{ruby-position:over}h1,h2,h3,h4{break-after:avoid}body .reader-highlight{background:#fef08a!important;color:#1a1a1a!important;-webkit-text-fill-color:#1a1a1a!important;border-radius:2px}body .reader-highlight[data-color="green"]{background:#86efac!important;color:#052e16!important;-webkit-text-fill-color:#052e16!important}body .reader-highlight[data-color="blue"]{background:#7dd3fc!important;color:#082f49!important;-webkit-text-fill-color:#082f49!important}body .reader-highlight[data-color="pink"]{background:#f9a8d4!important;color:#500724!important;-webkit-text-fill-color:#500724!important}.reader-underline{background:transparent!important;color:inherit!important;text-decoration:underline 2px currentColor;text-underline-offset:3px}${readingLayout}`
}

function applyReaderAppearance({ ratio, locator } = {}) {
  if (!state.book) return
  
  const frame = $('#readerFrame')
  const doc = frame.contentDocument
  const win = frame.contentWindow
  const style = doc?.getElementById('reader-runtime-style')
  
  if (!style || !win) return
  
  const anchor = locator || captureReadingLocator()
  const position = Number.isFinite(ratio) ? ratio : chapterRatio()
  const settings = getSettings()
  
  win.removeEventListener('scroll', handleReaderScroll)
  
  style.textContent = buildReaderCss(settings)
  frame.style.background = 'var(--paper)'
  
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (state.epub.fixedLayout) {
      state.pageCount = 1
      state.page = 0
      win.scrollTo(0, 0)
    } else {
      state.pageCount = 1
      state.page = 0
      const max = Math.max(0, doc.documentElement.scrollHeight - frame.clientHeight)
      
      if (anchor) {
        scrollToLocator(doc, anchor)
      } else {
        win.scrollTo({ left: 0, top: position * max })
      }
      
      state.book.scrollTop = win.scrollY
      win.addEventListener('scroll', handleReaderScroll, { passive: true })
    }
    
    updateReadingProgress()
    showReadingStatus()
    saveCurrentBook()
  }))
}
